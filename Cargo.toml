[package]
name = "empyrean-validation"
version = "0.7.0"
edition = "2024"
publish = false
rust-version = "1.90.0"
authors = ["Joachim Moeyens <joachim@empyrean-dynamics.com>", "Empyrean Dynamics"]
description = "Cross-channel validation framework for the empyrean astrodynamics stack — schema, test catalog, plan generator, report renderer, and external-reference runners (ASSIST, find_orb, kete) shared by every empyrean repo's CI."
repository = "https://github.com/Empyrean-Dynamics/empyrean-validation"
include = ["src/**/*", "catalog.json", "Cargo.toml", "docs/katex-header.html"]

[lib]
name = "empyrean_validation"

[[bin]]
name = "empyrean-validation"
path = "src/bin/cli.rs"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/katex-header.html"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# villeneuve provides the SBDB / Horizons disk-cached query clients used
# by the plan generator. Pinned to the release generation this harness
# version validates (empyrean 0.7.0 binds villeneuve v1.14.0 through
# empyrean-core v0.7.0). Validating unreleased engine work is a deliberate,
# uncommitted local override — see "Local development overrides" in the
# README.
villeneuve = { git = "ssh://git@github.com/Empyrean-Dynamics/villeneuve.git", tag = "v1.14.0", features = ["jpl"] }

[dev-dependencies]
tempfile = "3"
