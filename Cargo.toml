[package]
name = "empyrean-validation"
version = "0.9.1"
edition = "2024"
publish = false
rust-version = "1.90.0"
authors = ["Joachim Moeyens <joachim@empyrean-dynamics.com>", "Empyrean Dynamics"]
description = "Cross-channel validation framework for the empyrean astrodynamics stack — schema, test catalog, plan generator, report renderer, and external-reference runners (ASSIST, find_orb, kete, GRSS) shared by every empyrean repo's CI."
repository = "https://github.com/Empyrean-Dynamics/empyrean-validation"
include = [
    "src/**/*",
    "catalog.json",
    "Cargo.toml",
    "docs/katex-header.html",
    # include_str!-ed into every generated report; the build fails without it.
    "assets/empyrean-tokens.css",
]

[lib]
name = "empyrean_validation"

[[bin]]
name = "empyrean-validation"
path = "src/bin/cli.rs"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/katex-header.html"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The harness consumes only PUBLIC crates: the published `empyrean`
# wrapper supplies the SBDB / Horizons query clients (disk-cached via
# `cache_dir`) used by the plan generator, and `hyperjet` supplies the
# linear-algebra kernels the covariance comparison uses. Both are pinned
# exactly to the release generation this harness version validates, so a
# checkout of a validation tag reproduces the validation-of-record.
empyrean = "=0.9.0"
hyperjet = "=1.9.0"

[dev-dependencies]
tempfile = "3"
