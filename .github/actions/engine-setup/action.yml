name: Engine setup
description: >
  Sibling checkouts, toolchain, and the shared caches every job that builds or
  runs the private engine needs. Extracted so `prep` and the per-object
  `reference` matrix cannot drift apart — a matrix leg that set its environment
  up even slightly differently from prep would produce reference numbers that
  are not comparable, and nothing downstream would notice.

inputs:
  gh-pat:
    description: PAT with read access to the private engine repos.
    required: true
  python-version:
    description: Python to install.
    required: true
  dataset:
    description: >
      Registered kernel-set slug in gs://empyrean-data (lang/workflow/gcp-project.md,
      "CI consumption"). Keys the ~1.3 GB kernel cache and names what the writer syncs.
    required: true
  workload-identity-provider:
    description: >
      Workload Identity Federation provider resource for the kernel bucket — the
      repository's `GCP_WORKLOAD_IDENTITY_PROVIDER` variable, passed in because a
      composite action cannot read `vars`. Required for the writer; readers ignore it.
    required: false
    default: ""
  service-account:
    description: >
      Service account the writer impersonates for read-only access to
      gs://empyrean-data — the repository's `GCP_DATA_READER_SA` variable.
    required: false
    default: ""
  jpl-cache-key:
    description: Key for the JPL Horizons/SBDB response cache.
    required: true
  role:
    description: >
      `writer` (prep) may download and save the shared caches. `reader` (matrix
      legs) must restore them warm and fails on a miss — 50 legs each pulling
      2 GB from NAIF would hammer an external service the suite does not own,
      and a leg that silently re-downloaded could disagree with prep's kernels.
    required: false
    default: reader
  install-python-tooling:
    description: Install uv (only the wheel-building jobs need it).
    required: false
    default: "false"

outputs:
  fixture-snapshot-id:
    description: snapshot_id from fixtures/manifest.json, for cache keying.
    value: ${{ steps.fixtures-key.outputs.id }}

runs:
  using: composite
  steps:
    # The c, python and cli channels build the distribution (header, dylib,
    # wheel) from the empyrean sibling checkout below, so that checkout must be
    # the exact release the manifests pin (runners/rust/Cargo.toml → crates.io),
    # not the floating default branch — which moves ahead to an unreleased rc
    # and makes `check-engine-version` refuse the run. Read the pin here (the
    # suite checkout lives at empyrean-validation/ in every caller) and pin the
    # empyrean checkout to its tag.
    - name: Resolve the pinned distribution version
      id: pinned-engine
      shell: bash
      run: |
        version="$(sed -n 's/^empyrean = "=\(.*\)"/\1/p' empyrean-validation/runners/rust/Cargo.toml)"
        if [ -z "$version" ]; then
          echo "ERROR: could not read the pinned empyrean version from empyrean-validation/runners/rust/Cargo.toml." >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Pinned distribution: v$version"

    # ── Sibling-checkout layout ────────────────────────────────
    # The Makefile resolves every sibling from `..` of the
    # empyrean-validation checkout, so each repo MUST sit alongside it.
    #
    # empyrean-validation itself is NOT checked out here: this action lives
    # inside that repo, and `uses: ./...` can only resolve a path that is
    # already on disk. Every caller therefore checks out empyrean-validation
    # into ./empyrean-validation first, and this action adds the siblings.
    - name: Checkout empyrean (sibling)
      uses: actions/checkout@v4
      with:
        repository: Empyrean-Dynamics/empyrean
        path: empyrean
        token: ${{ inputs.gh-pat }}
        # Pin to the released tag the manifests resolve to (see above), not the
        # default branch. The other siblings stay on their default branch; the
        # core channel's pin is a separate follow-up.
        ref: v${{ steps.pinned-engine.outputs.version }}
    - name: Checkout empyrean-core (sibling)
      uses: actions/checkout@v4
      with:
        repository: Empyrean-Dynamics/empyrean-core
        path: empyrean-core
        token: ${{ inputs.gh-pat }}
    - name: Checkout core dep (transitive)
      uses: actions/checkout@v4
      with:
        repository: Empyrean-Dynamics/scott
        path: scott
        token: ${{ inputs.gh-pat }}
    - name: Checkout core dep 2 (transitive)
      uses: actions/checkout@v4
      with:
        repository: Empyrean-Dynamics/villeneuve
        path: villeneuve
        token: ${{ inputs.gh-pat }}
    - name: Checkout nolan (transitive)
      uses: actions/checkout@v4
      with:
        repository: Empyrean-Dynamics/nolan
        path: nolan
        token: ${{ inputs.gh-pat }}
    - name: Configure git for any non-patched private deps
      shell: bash
      run: git config --global url."https://x-access-token:${{ inputs.gh-pat }}@github.com/".insteadOf "ssh://git@github.com/"

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ""
        cache-workspaces: |
          empyrean-validation
          empyrean-validation/runners/rust
          empyrean-validation/runners/cli
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv (used by empyrean-py wheel build)
      if: inputs.install-python-tooling == 'true'
      shell: bash
      run: pip install uv

    # ── Data kernels: the registered set (~1.3 GB) + two suite extras ──────
    # Kernels come from the registered set in gs://empyrean-data — the slug every
    # empyrean repo pins — never from the moving NAIF/SSD URLs (a renamed Earth
    # PCK broke every run from 2026-08-20 and nothing was published for months).
    # The cache carries the slug; `restore-keys` restores the previous set so a
    # slug bump fetches only the delta; the writer ALWAYS syncs, which re-hashes
    # every file, so the cache is verified, not trusted. Readers restore the
    # exact slug key and refuse on a miss: prep is the sole writer.
    - name: Restore empyrean data kernels
      id: cache-data
      uses: actions/cache/restore@v4
      with:
        path: data
        key: empyrean-data-${{ inputs.dataset }}
        restore-keys: ${{ inputs.role == 'writer' && 'empyrean-data-' || '' }}
    - name: Require a warm kernel cache (reader role)
      if: inputs.role != 'writer' && steps.cache-data.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "ERROR: data-kernel cache miss on key empyrean-data-${{ inputs.dataset }}," >&2
        echo "       and this job's role is 'reader' so it will not sync them." >&2
        echo "       prep is the sole writer of this cache. A miss here means prep" >&2
        echo "       did not run, its sync failed, or the slug changed between" >&2
        echo "       jobs in the same run." >&2
        echo "       Refusing to run the reference against kernels prep did not use." >&2
        exit 1
    - name: Require the kernel-bucket identity (writer)
      if: inputs.role == 'writer' && (inputs.workload-identity-provider == '' || inputs.service-account == '')
      shell: bash
      run: |
        echo "ERROR: this job is the kernel-set writer but received no Workload Identity" >&2
        echo "       provider / service account. Set the repository variables" >&2
        echo "       GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DATA_READER_SA and pass them to" >&2
        echo "       engine-setup (lang/workflow/gcp-project.md, 'CI consumption')." >&2
        exit 1
    - name: Authenticate to the kernel bucket (writer)
      if: inputs.role == 'writer'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
    - name: Sync the registered kernel set (writer)
      if: inputs.role == 'writer'
      shell: bash
      run: |
        gcloud storage cp gs://empyrean-data/tools/empyrean-data.py "$RUNNER_TEMP/empyrean-data.py"
        # The target is the workflow's EMPYREAN_DATA_DIR (= $GITHUB_WORKSPACE/data);
        # the Makefile receives the same path as DATA_DIR.
        python3 "$RUNNER_TEMP/empyrean-data.py" sync "${{ inputs.dataset }}" "$GITHUB_WORKSPACE/data" --prune
    # Two suite-specific files written AFTER the sync so `--prune` cannot remove
    # them. (1) find_orb's binary DE440 (linux_p1550p2650.440) is not an engine
    # kernel and not in the registered set; it comes from a stable SSD URL and is
    # cached under its own key — the one direct NASA URL this repo keeps, listed
    # as the documented exception in lang's drift checker. (2) The observatory
    # codes: the registered set carries the engine's own obscodes_extended.json
    # (277 KB), but the validation of record was produced with the copy vendored
    # in-repo (275 KB, kept because MPC throttles Actions IPs), so this run keeps
    # the vendored copy for parity. Switching to the registered copy changes
    # numbers and needs a measured re-baseline — a separate, tracked change.
    - name: Restore find_orb DE440 binary
      if: inputs.role == 'writer'
      id: cache-de440-bin
      uses: actions/cache/restore@v4
      with:
        path: de440-bin
        key: findorb-de440-linux_p1550p2650
    - name: Download find_orb DE440 binary
      if: inputs.role == 'writer' && steps.cache-de440-bin.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p de440-bin
        curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 60 \
          -o de440-bin/linux_p1550p2650.440 \
          https://ssd.jpl.nasa.gov/ftp/eph/planets/Linux/de440/linux_p1550p2650.440
    - name: Save find_orb DE440 binary
      if: inputs.role == 'writer' && steps.cache-de440-bin.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: de440-bin
        key: findorb-de440-linux_p1550p2650
    - name: Add the suite extras to the data directory (writer)
      if: inputs.role == 'writer'
      shell: bash
      run: |
        cp de440-bin/linux_p1550p2650.440 data/linux_p1550p2650.440
        gunzip -c "$GITHUB_WORKSPACE/empyrean-validation/assets/obscodes_extended.json.gz" > data/obscodes_extended.json
    - name: Save empyrean data kernels
      if: inputs.role == 'writer' && steps.cache-data.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: data
        key: empyrean-data-${{ inputs.dataset }}

    # JPL Horizons + SBDB API responses. prep is the writer: it fetches every
    # IC + reference vector once, so the fan-out legs restore a warm cache and
    # never hammer JPL. Legs restore read-only for the same reason.
    - name: Cache JPL API responses (writer)
      if: inputs.role == 'writer'
      uses: actions/cache@v4
      with:
        path: ~/.empyrean/cache
        key: ${{ inputs.jpl-cache-key }}
    - name: Restore JPL API responses (reader)
      if: inputs.role != 'writer'
      uses: actions/cache/restore@v4
      with:
        path: ~/.empyrean/cache
        key: ${{ inputs.jpl-cache-key }}

    - name: Cache cargo state
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          empyrean/target
          empyrean-core/target
          empyrean-validation/target
        key: cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: cargo-

    # ── OD fixtures (GCS snapshot pinned by fixtures/manifest.json) ────
    # Same poison discipline as the data kernels: restore by snapshot key,
    # ALWAYS run the fetch — on a cache hit it is a pure sha256 verify of every
    # file, so a poisoned or truncated cache fails here instead of reaching a
    # fit — and SAVE only on a miss, after a fully verified fetch. Plain public
    # HTTPS (the data is public MPC astrometry): no gcloud, no credential, which
    # is why every role may fetch these itself.
    - name: Read fixture snapshot id
      id: fixtures-key
      shell: bash
      working-directory: empyrean-validation
      run: python3 -c "import json; print('id=' + json.load(open('fixtures/manifest.json'))['snapshot_id'])" >> "$GITHUB_OUTPUT"
    - name: Restore OD fixtures
      id: cache-fixtures
      uses: actions/cache/restore@v4
      with:
        path: |
          empyrean-validation/fixtures/psv/*.psv
          empyrean-validation/fixtures/psv-radar/*.psv
        key: fixtures-${{ steps.fixtures-key.outputs.id }}
    - name: Fetch + verify OD fixtures
      shell: bash
      working-directory: empyrean-validation
      run: make fixtures
    - name: Save OD fixtures
      if: steps.cache-fixtures.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          empyrean-validation/fixtures/psv/*.psv
          empyrean-validation/fixtures/psv-radar/*.psv
        key: fixtures-${{ steps.fixtures-key.outputs.id }}
