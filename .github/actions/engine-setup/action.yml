name: Engine setup
description: >
  Sibling checkouts, toolchain, and the shared caches every job that builds or
  runs the private engine needs. Extracted so `prep` and the per-object
  `reference` matrix cannot drift apart — a matrix leg that set its environment
  up even slightly differently from prep would produce reference numbers that
  are not comparable, and nothing downstream would notice.

inputs:
  gh-pat:
    description: PAT with read access to the private engine repos.
    required: true
  python-version:
    description: Python to install.
    required: true
  dataset:
    description: >
      Registered kernel-set slug in gs://empyrean-data (lang/workflow/gcp-project.md,
      "CI consumption"). Keys the ~1.3 GB kernel cache and names what the writer syncs.
    required: true
  workload-identity-provider:
    description: >
      Workload Identity Federation provider resource for the kernel bucket — the
      repository's `GCP_WORKLOAD_IDENTITY_PROVIDER` variable, passed in because a
      composite action cannot read `vars`. Required for the writer; readers ignore it.
    required: false
    default: ""
  service-account:
    description: >
      Service account the writer impersonates for read-only access to
      gs://empyrean-data — the repository's `GCP_DATA_READER_SA` variable.
    required: false
    default: ""
  inputs-snapshot-id:
    description: >
      snapshot_id of the pinned inputs snapshot (fixtures/manifest.json),
      read by the workflow's prep step and passed in — a composite action
      cannot read `vars` and does not re-read the pin. Keys the inputs cache
      (`inputs-<id>`) the writer saves and every reader restores. Empty ("")
      disables the inputs steps entirely: the mint workflow runs engine-setup
      before any snapshot exists (chicken-and-egg on the first mint) and must
      never depend on one, so it passes no id. The validation workflow always
      passes it.
    required: false
    default: ""
  role:
    description: >
      `writer` (prep) may download and save the shared caches. `reader` (matrix
      legs) must restore them warm and fails on a miss — 50 legs each pulling
      2 GB from NAIF would hammer an external service the suite does not own,
      and a leg that silently re-downloaded could disagree with prep's kernels.
    required: false
    default: reader
  install-python-tooling:
    description: Install uv (only the wheel-building jobs need it).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # The c, python and cli channels build the distribution (header, dylib,
    # wheel) from the empyrean sibling checkout below, so that checkout must be
    # the exact release the manifests pin (runners/rust/Cargo.toml → crates.io),
    # not the floating default branch — which moves ahead to an unreleased rc
    # and makes `check-engine-version` refuse the run. Read the pin here (the
    # suite checkout lives at empyrean-validation/ in every caller) and pin the
    # empyrean checkout to its tag.
    - name: Resolve the pinned distribution version
      id: pinned-engine
      shell: bash
      run: |
        version="$(sed -n 's/^empyrean = "=\(.*\)"/\1/p' empyrean-validation/runners/rust/Cargo.toml)"
        if [ -z "$version" ]; then
          echo "ERROR: could not read the pinned empyrean version from empyrean-validation/runners/rust/Cargo.toml." >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "Pinned distribution: v$version"

    # ── Sibling-checkout layout ────────────────────────────────
    # The Makefile resolves every sibling from `..` of the
    # empyrean-validation checkout, so each repo MUST sit alongside it.
    #
    # empyrean-validation itself is NOT checked out here: this action lives
    # inside that repo, and `uses: ./...` can only resolve a path that is
    # already on disk. Every caller therefore checks out empyrean-validation
    # into ./empyrean-validation first, and this action adds the siblings.
    - name: Checkout empyrean (sibling)
      uses: actions/checkout@v4
      with:
        repository: Empyrean-Dynamics/empyrean
        path: empyrean
        token: ${{ inputs.gh-pat }}
        # Pin to the released tag the manifests resolve to (see above), not the
        # default branch. The other siblings stay on their default branch; the
        # core channel's pin is a separate follow-up.
        ref: v${{ steps.pinned-engine.outputs.version }}
    - name: Checkout empyrean-core (sibling)
      uses: actions/checkout@v4
      with:
        repository: Empyrean-Dynamics/empyrean-core
        path: empyrean-core
        token: ${{ inputs.gh-pat }}
    - name: Checkout core dep (transitive)
      uses: actions/checkout@v4
      with:
        repository: Empyrean-Dynamics/scott
        path: scott
        token: ${{ inputs.gh-pat }}
    - name: Checkout core dep 2 (transitive)
      uses: actions/checkout@v4
      with:
        repository: Empyrean-Dynamics/villeneuve
        path: villeneuve
        token: ${{ inputs.gh-pat }}
    - name: Checkout nolan (transitive)
      uses: actions/checkout@v4
      with:
        repository: Empyrean-Dynamics/nolan
        path: nolan
        token: ${{ inputs.gh-pat }}
    - name: Configure git for any non-patched private deps
      shell: bash
      run: git config --global url."https://x-access-token:${{ inputs.gh-pat }}@github.com/".insteadOf "ssh://git@github.com/"

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ""
        cache-workspaces: |
          empyrean-validation
          empyrean-validation/runners/rust
          empyrean-validation/runners/cli
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv (used by empyrean-py wheel build)
      if: inputs.install-python-tooling == 'true'
      shell: bash
      run: pip install uv

    # ── Data kernels: the registered set (~1.3 GB) + two suite extras ──────
    # Kernels come from the registered set in gs://empyrean-data — the slug every
    # empyrean repo pins — never from the moving NAIF/SSD URLs (a renamed Earth
    # PCK broke every run from 2026-08-20 and nothing was published for months).
    # The cache carries the slug; `restore-keys` restores the previous set so a
    # slug bump fetches only the delta; the writer ALWAYS syncs, which re-hashes
    # every file, so the cache is verified, not trusted. Readers restore the
    # exact slug key and refuse on a miss: prep is the sole writer. The key also
    # names what the suite writes into the directory beside the set (`set-codes`:
    # the registered observatory codes, nothing written over them); a change of
    # that policy must miss the old cache, or readers would restore the previous
    # policy's directory while the writer re-synced its own.
    - name: Restore empyrean data kernels
      id: cache-data
      uses: actions/cache/restore@v4
      with:
        path: data
        key: empyrean-data-${{ inputs.dataset }}-set-codes
        restore-keys: ${{ inputs.role == 'writer' && 'empyrean-data-' || '' }}
    - name: Require a warm kernel cache (reader role)
      if: inputs.role != 'writer' && steps.cache-data.outputs.cache-hit != 'true' && env.ACT != 'true'
      shell: bash
      run: |
        echo "ERROR: data-kernel cache miss on key empyrean-data-${{ inputs.dataset }}-set-codes," >&2
        echo "       and this job's role is 'reader' so it will not sync them." >&2
        echo "       prep is the sole writer of this cache. A miss here means prep" >&2
        echo "       did not run, its sync failed, or the slug changed between" >&2
        echo "       jobs in the same run." >&2
        echo "       Refusing to run the reference against kernels prep did not use." >&2
        exit 1
    - name: Require the kernel-bucket identity (writer)
      if: inputs.role == 'writer' && env.ACT != 'true' && (inputs.workload-identity-provider == '' || inputs.service-account == '')
      shell: bash
      run: |
        echo "ERROR: this job is the kernel-set writer but received no Workload Identity" >&2
        echo "       provider / service account. Set the repository variables" >&2
        echo "       GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DATA_READER_SA and pass them to" >&2
        echo "       engine-setup (lang/workflow/gcp-project.md, 'CI consumption')." >&2
        exit 1
    - name: Authenticate to the kernel bucket (writer)
      if: inputs.role == 'writer' && env.ACT != 'true'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
    - name: Sync the registered kernel set (writer)
      if: inputs.role == 'writer' && env.ACT != 'true'
      shell: bash
      run: |
        gcloud storage cp gs://empyrean-data/tools/empyrean-data.py "$RUNNER_TEMP/empyrean-data.py"
        # The target is the workflow's EMPYREAN_DATA_DIR (= $GITHUB_WORKSPACE/data);
        # the Makefile receives the same path as DATA_DIR.
        python3 "$RUNNER_TEMP/empyrean-data.py" sync "${{ inputs.dataset }}" "$GITHUB_WORKSPACE/data" --prune
    # Under `gh act` (a local rehearsal; act sets ACT=true in the job container)
    # there is no identity federation, so the set cannot be synced from the
    # bucket. The host bind-mounts its own synced copy of the SAME slug and the
    # job copies it in — the writer always, a reader only when act's cache
    # server had nothing for the key. Nothing else about the run changes, so a
    # local pass rehearses the hosted one; a hosted run never takes this step.
    - name: Copy the registered kernel set from the host mount (act)
      if: env.ACT == 'true' && (inputs.role == 'writer' || steps.cache-data.outputs.cache-hit != 'true')
      shell: bash
      run: |
        src="${ACT_DATA_DIR:-/host-data}"
        if [ ! -f "$src/obscodes_extended.json" ] || [ ! -f "$src/de440.bsp" ]; then
          echo "ERROR: running under act, but no registered kernel set is mounted at $src." >&2
          echo "       Mount the locally synced '${{ inputs.dataset }}' directory, e.g." >&2
          echo "       --container-options '--mount type=bind,source=<local copy>,target=/host-data,readonly'" >&2
          exit 1
        fi
        rm -rf "$GITHUB_WORKSPACE/data" && mkdir -p "$GITHUB_WORKSPACE/data" && cp -a "$src"/. "$GITHUB_WORKSPACE/data"/
        echo "act: copied $(ls "$GITHUB_WORKSPACE/data" | wc -l) files of ${{ inputs.dataset }} from $src"
    # One suite-specific file written AFTER the sync so `--prune` cannot remove
    # it: find_orb's binary DE440 (linux_p1550p2650.440) is not an engine kernel
    # and not in the registered set; it comes from a stable SSD URL and is cached
    # under its own key — the one direct NASA URL this repo keeps, listed as the
    # documented exception in lang's drift checker. The observatory codes are the
    # registered set's own obscodes_extended.json, synced above — the file every
    # other empyrean repo's CI reads. The copy once vendored in-repo (July 2026,
    # kept for parity with the validation of record) differed from it at two
    # stations the fixtures use (Z84 by about 38 m, B42 by about 300 m), enough
    # to flip the marginal Apophis optical+radar fit on one platform (2026-10-26).
    # Nothing is written over the set's file any more; the cache key suffix
    # records that.
    - name: Restore find_orb DE440 binary
      if: inputs.role == 'writer'
      id: cache-de440-bin
      uses: actions/cache/restore@v4
      with:
        path: de440-bin
        key: findorb-de440-linux_p1550p2650
    - name: Download find_orb DE440 binary
      if: inputs.role == 'writer' && steps.cache-de440-bin.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p de440-bin
        curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 60 \
          -o de440-bin/linux_p1550p2650.440 \
          https://ssd.jpl.nasa.gov/ftp/eph/planets/Linux/de440/linux_p1550p2650.440
    - name: Save find_orb DE440 binary
      if: inputs.role == 'writer' && steps.cache-de440-bin.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: de440-bin
        key: findorb-de440-linux_p1550p2650
    - name: Add find_orb's DE440 to the data directory (writer)
      if: inputs.role == 'writer'
      shell: bash
      run: |
        cp de440-bin/linux_p1550p2650.440 data/linux_p1550p2650.440
    - name: Save empyrean data kernels
      if: inputs.role == 'writer' && steps.cache-data.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: data
        key: empyrean-data-${{ inputs.dataset }}-set-codes

    - name: Cache cargo state
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          empyrean/target
          empyrean-core/target
          empyrean-validation/target
        key: cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: cargo-

    # ── Inputs snapshot (public validation bucket, pinned by the manifest) ──
    # The four product directories (psv, psv-radar, horizons, sbdb) + the
    # per-file MANIFEST.json are one immutable snapshot in the suite's
    # public-read bucket. prep is the sole fetcher, but the fetch is a plain
    # HTTPS read (python3 + network only, no credential, independent of the
    # kernel-set auth above): `make fixtures` then saves the cache. Every
    # reader restores the exact key and refuses on a miss, then re-verifies the
    # snapshot offline (sha256 of every file), so a poisoned or truncated cache
    # fails here instead of reaching a fit.
    # inputs-snapshot-id is empty when the mint runs engine-setup (no snapshot
    # exists yet on the first mint), which disables every inputs step below;
    # the validation workflow always passes an id.
    - name: Restore inputs snapshot (writer)
      if: inputs.role == 'writer' && inputs.inputs-snapshot-id != ''
      id: cache-inputs-writer
      uses: actions/cache/restore@v4
      with:
        path: |
          empyrean-validation/fixtures/psv
          empyrean-validation/fixtures/psv-radar
          empyrean-validation/fixtures/horizons
          empyrean-validation/fixtures/sbdb
          empyrean-validation/fixtures/MANIFEST.json
        key: inputs-${{ inputs.inputs-snapshot-id }}
    - name: Fetch + verify the pinned inputs snapshot (writer)
      if: inputs.role == 'writer' && inputs.inputs-snapshot-id != ''
      shell: bash
      working-directory: empyrean-validation
      run: make fixtures
    - name: Save inputs snapshot (writer)
      if: inputs.role == 'writer' && inputs.inputs-snapshot-id != '' && steps.cache-inputs-writer.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          empyrean-validation/fixtures/psv
          empyrean-validation/fixtures/psv-radar
          empyrean-validation/fixtures/horizons
          empyrean-validation/fixtures/sbdb
          empyrean-validation/fixtures/MANIFEST.json
        key: inputs-${{ inputs.inputs-snapshot-id }}
    - name: Restore inputs snapshot (reader)
      if: inputs.role != 'writer' && inputs.inputs-snapshot-id != ''
      id: cache-inputs-reader
      uses: actions/cache/restore@v4
      with:
        path: |
          empyrean-validation/fixtures/psv
          empyrean-validation/fixtures/psv-radar
          empyrean-validation/fixtures/horizons
          empyrean-validation/fixtures/sbdb
          empyrean-validation/fixtures/MANIFEST.json
        key: inputs-${{ inputs.inputs-snapshot-id }}
    - name: Require a warm inputs cache (reader role)
      if: inputs.role != 'writer' && inputs.inputs-snapshot-id != '' && steps.cache-inputs-reader.outputs.cache-hit != 'true'
      shell: bash
      run: |
        echo "ERROR: inputs-snapshot cache miss on key inputs-${{ inputs.inputs-snapshot-id }}," >&2
        echo "       and this job's role is 'reader' so it will not fetch them." >&2
        echo "       prep is the sole writer of this cache. A miss here means prep" >&2
        echo "       did not run, its fetch failed, or the snapshot id changed" >&2
        echo "       between jobs in the same run." >&2
        echo "       Refusing to run against inputs prep did not pin." >&2
        exit 1
    - name: Verify the pinned inputs snapshot offline (reader)
      if: inputs.role != 'writer' && inputs.inputs-snapshot-id != ''
      shell: bash
      working-directory: empyrean-validation
      run: make fixtures INPUTS_OFFLINE=1
