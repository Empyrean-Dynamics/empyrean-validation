name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build & Lint ────────────────────────────────────────────────
  # The harness and the rust runner consume only published crates
  # (`empyrean`, `hyperjet`), so CI needs no private checkouts or
  # tokens — a plain clone builds everything below.
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
          cache-workspaces: |
            .
            runners/rust

      - name: Build (harness)
        run: cargo build --verbose

      - name: Lint (harness)
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --all-features

      - name: Build + Lint (rust runner)
        working-directory: runners/rust
        run: |
          cargo build --verbose
          cargo fmt -- --check
          cargo clippy --all-targets

  # ── Test ────────────────────────────────────────────────────────
  test:
    name: Test
    needs: build-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # The harness tests read the OD fixture set (catalog.rs pins
      # RADAR_FIXTURE_OBJECTS against the files on disk), which is not in
      # git: fixtures/manifest.json pins an immutable public-read GCS
      # snapshot. Same restore → always-verify fetch → save-on-miss poison
      # discipline as .github/workflows/validation.yml: the fetch script
      # verifies every sha256 even on a cache hit, so a poisoned cache
      # fails here rather than reaching a test.
      - name: Read fixture snapshot id
        id: fixtures-key
        run: python3 -c "import json; print('id=' + json.load(open('fixtures/manifest.json'))['snapshot_id'])" >> "$GITHUB_OUTPUT"
      - name: Restore OD fixtures
        id: cache-fixtures
        uses: actions/cache/restore@v4
        with:
          path: |
            fixtures/psv/*.psv
            fixtures/psv-radar/*.psv
          key: fixtures-${{ steps.fixtures-key.outputs.id }}
      - name: Fetch + verify OD fixtures
        run: ./scripts/fetch-fixtures.sh
      - name: Save OD fixtures
        if: steps.cache-fixtures.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            fixtures/psv/*.psv
            fixtures/psv-radar/*.psv
          key: fixtures-${{ steps.fixtures-key.outputs.id }}

      - name: Unit tests
        run: cargo test --verbose
