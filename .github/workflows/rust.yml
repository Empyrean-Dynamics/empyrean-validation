name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build & Lint ────────────────────────────────────────────────
  # The harness and the rust runner consume only published crates
  # (`empyrean`, `hyperjet`), so CI needs no private checkouts or
  # tokens — a plain clone builds everything below.
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
          cache-workspaces: |
            .
            runners/rust

      - name: Build (harness)
        run: cargo build --verbose

      - name: Lint (harness)
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --all-features

      # Static-check the workflows themselves. The validation suite fans out to
      # ~55 jobs, and its most dangerous failure mode is a job that is SKIPPED
      # rather than failed: a stale `needs.<job>.result` in an `if:` reads null,
      # the condition is false forever, and the run reports success with the gate
      # never having executed. actionlint catches exactly that, plus undefined
      # matrix/output references. Cheap, and nothing else here can see it.
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Lint (workflows)
        run: make lint-workflows

      - name: Build + Lint (rust runner)
        working-directory: runners/rust
        run: |
          cargo build --verbose
          cargo fmt -- --check
          cargo clippy --all-targets

  # ── Test ────────────────────────────────────────────────────────
  test:
    name: Test
    needs: build-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      # The harness tests read the OD fixture set (catalog.rs pins
      # RADAR_FIXTURE_OBJECTS against the files on disk), which is not in git:
      # fixtures/manifest.json pins one immutable snapshot in the suite's
      # public validation bucket. Restore → always-verify fetch → save-on-miss
      # poison discipline: `make fixtures` fetches over plain HTTPS and verifies
      # every sha256 even on a cache hit, so a poisoned cache fails here rather
      # than reaching a test. Public-read, no credential — this job, like
      # build-lint, runs on any clone including fork PRs.
      - name: Read inputs snapshot id
        id: inputs-id
        run: python3 -c "import json; print('id=' + json.load(open('fixtures/manifest.json'))['snapshot_id'])" >> "$GITHUB_OUTPUT"
      - name: Restore inputs snapshot
        id: cache-inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            fixtures/psv
            fixtures/psv-radar
            fixtures/horizons
            fixtures/sbdb
            fixtures/MANIFEST.json
          key: inputs-${{ steps.inputs-id.outputs.id }}
      - name: Fetch + verify the pinned inputs snapshot
        run: make fixtures
      - name: Save inputs snapshot
        if: steps.cache-inputs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            fixtures/psv
            fixtures/psv-radar
            fixtures/horizons
            fixtures/sbdb
            fixtures/MANIFEST.json
          key: inputs-${{ steps.inputs-id.outputs.id }}

      - name: Unit tests
        run: cargo test --verbose
