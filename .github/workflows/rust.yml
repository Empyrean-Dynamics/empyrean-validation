name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build & Lint ────────────────────────────────────────────────
  # The harness and the rust runner consume only published crates
  # (`empyrean`, `hyperjet`), so CI needs no private checkouts or
  # tokens — a plain clone builds everything below.
  build-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: ""
          cache-workspaces: |
            .
            runners/rust

      - name: Build (harness)
        run: cargo build --verbose

      - name: Lint (harness)
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --all-features

      - name: Build + Lint (rust runner)
        working-directory: runners/rust
        run: |
          cargo build --verbose
          cargo fmt -- --check
          cargo clippy --all-targets

  # ── Test ────────────────────────────────────────────────────────
  test:
    name: Test
    needs: build-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Unit tests
        run: cargo test --verbose
