name: Validation Suite

# Centralized in empyrean-validation because the framework owns the
# pipeline (schema, catalog, plan, report, ci-check, external-reference
# runners). Per-channel runners (rust / python / c / cli / core) still
# live in the repos whose surface they exercise — empyrean and
# empyrean-core — and are checked out here as siblings.
#
# Triggers:
#   - cron                — Monday 06:00 UTC weekly refresh
#   - dispatch            — manual run with optional OBJECTS / TIER inputs
#   - push                — any change to this repo's main (framework
#                           / schema / external-runner code, the
#                           orchestrator Makefile, or this workflow
#                           itself)
#   - repository_dispatch — fired by sibling repos when their main /
#                           release lands (see "Cross-repo dispatch"
#                           below).
#
# Cross-repo dispatch
# ──────────────────────────────────────────────────────────────────
# Two event types are accepted:
#   - sibling-main-push : empyrean / empyrean-core push to main.
#                         Fires immediately because every push to
#                         either of those is the next release
#                         candidate users will feel.
#   - sibling-tag-push  : a private engine repo tags a release.
#                         Pre-tag main pushes are not dispatched —
#                         the tag is the moment the upstream commits
#                         to "this is the version the rest of the
#                         stack will adopt." Validation gates that
#                         transition.
#
# `client_payload.source` carries the dispatching repo's full name
# (`Empyrean-Dynamics/<repo>`) and `client_payload.sha` (or `tag` for
# tag pushes) carries the commit / tag that triggered the run.
# Senders need a fine-grained PAT scoped to this repo only with
# `Contents: read and write` (the repository_dispatch endpoint's
# fine-grained requirement — NOT `actions: write`, which is for the
# workflow_dispatch endpoint), stored on the sender side as
# `VALIDATION_DISPATCH_TOKEN`.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      objects:
        description: "Subset of objects to validate (comma-separated; empty = all)"
        type: string
        default: ""
      tier:
        description: "Force model tier (approximate / basic / standard)"
        type: string
        default: "standard"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**.md"
  repository_dispatch:
    types: [sibling-main-push, sibling-tag-push]

permissions:
  contents: read
  id-token: write  # Workload Identity Federation for GCS upload

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  GCS_BUCKET: gs://empyrean-validation
  EMPYREAN_DATA_DIR: ${{ github.workspace }}/data
  # The numerical-parity suite runs on a single interpreter by design: the
  # empyrean python channel ships as an abi3 wheel, so its compiled binary is
  # byte-identical across CPython 3.10–3.14 — running the (expensive) suite per
  # version would add cost with no signal. Per-version *Python* coverage lives in
  # the empyrean repo's own CI (lint + mypy + tests across the support range).
  PYTHON_VERSION: "3.12"
  OBJECTS: ${{ inputs.objects || 'Apophis,Bennu,Eros,Vesta,2018 LA' }}
  TIER: ${{ inputs.tier || 'standard' }}

jobs:
  # The full suite needs the empyrean wrapper repo for the rust /
  # python / c / cli channel runners, and that repo has no public push
  # yet (its first publish rides the wrapper release). Until it
  # exists, skip the suite cleanly instead of failing on the sibling
  # checkout — a red run here must mean broken validation, not an
  # unpublished sibling. The probe makes the suite resume
  # automatically on the wrapper repo's first push.
  precheck:
    name: Sibling availability
    runs-on: ubuntu-latest
    outputs:
      empyrean-available: ${{ steps.probe.outputs.available }}
    steps:
      - name: Probe for the empyrean wrapper repo
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if gh api repos/Empyrean-Dynamics/empyrean --silent 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Validation suite skipped::Empyrean-Dynamics/empyrean is not published yet; the full-channel suite resumes automatically once the wrapper repo exists."
          fi

  validate:
    name: Build + run + report
    needs: precheck
    if: needs.precheck.outputs.empyrean-available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ── Trace what fired this run ──────────────────────────────
      # Surfaces the sender repo + sha/tag in the GitHub UI's Annotations
      # tab so triaging "who broke validation" is one click instead of
      # a hunt through the run summary JSON.
      - name: Log trigger source
        run: |
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "Dispatch type:    ${{ github.event.action }}"
            echo "Source repo:      ${{ github.event.client_payload.source }}"
            echo "Source sha:       ${{ github.event.client_payload.sha }}"
            echo "Source tag:       ${{ github.event.client_payload.tag }}"
          fi

      # ── Sibling-checkout layout ────────────────────────────────
      # The Makefile expects:
      #   <workspace>/empyrean/                 (rust / python / c / cli runners)
      #   <workspace>/empyrean-core/            (validate-core binary)
      #   <workspace>/empyrean-validation/      (this repo: framework + Makefile + externals)
      #   <workspace>/<engine siblings>/ (empyrean-core's private deps for [patch])
      # All paths in the Makefile resolve from `..` of the empyrean-validation
      # checkout, which means each repo MUST sit alongside it. We do that by
      # checking the default repo out under `path: empyrean-validation/`
      # rather than the workspace root.
      - name: Checkout empyrean-validation (default)
        uses: actions/checkout@v4
        with:
          path: empyrean-validation

      - name: Checkout empyrean (sibling)
        uses: actions/checkout@v4
        with:
          repository: Empyrean-Dynamics/empyrean
          path: empyrean
          token: ${{ secrets.GH_PAT }}

      - name: Checkout empyrean-core (sibling)
        uses: actions/checkout@v4
        with:
          repository: Empyrean-Dynamics/empyrean-core
          path: empyrean-core
          token: ${{ secrets.GH_PAT }}

      # Transitive deps — needed by the [patch] sections in
      # empyrean / empyrean-core / empyrean-validation Cargo.toml so
      # cargo resolves empyrean-core's private deps to local sibling
      # checkouts instead of the tagged git URLs (which would
      # otherwise duplicate the dep tree and produce incompatible
      # `Orbits<AU>` types across the workspace).
      - name: Checkout core dep (transitive)
        uses: actions/checkout@v4
        with:
          repository: Empyrean-Dynamics/scott
          path: scott
          token: ${{ secrets.GH_PAT }}

      - name: Checkout core dep 2 (transitive)
        uses: actions/checkout@v4
        with:
          repository: Empyrean-Dynamics/villeneuve
          path: villeneuve
          token: ${{ secrets.GH_PAT }}

      - name: Checkout nolan (transitive)
        uses: actions/checkout@v4
        with:
          repository: Empyrean-Dynamics/nolan
          path: nolan
          token: ${{ secrets.GH_PAT }}

      - name: Configure git for any non-patched private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "ssh://git@github.com/"

      # ── Toolchains ─────────────────────────────────────────────
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          # The repo checks out under empyrean-validation/ (sibling
          # layout), so the embedded rust-cache must be pointed at the
          # actual crate roots — with no config it runs cargo metadata
          # at the workspace root, finds no Cargo.toml, and errors.
          cache-workspaces: |
            empyrean-validation
            empyrean-validation/runners/rust
            empyrean-validation/runners/cli

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv (used by empyrean-py wheel build)
        run: pip install uv

      # ── Caches ─────────────────────────────────────────────────
      # SPICE kernels + DE440 + bias.dat — large (~2 GB). Restore by key,
      # but SAVE only after a complete, successful download (the explicit
      # save step below) so a transient NAIF/JPL outage mid-download can
      # never poison the cache with a partial kernel set that later runs
      # would silently trust. Bump the suffix when adding a kernel.
      - name: Restore empyrean data kernels
        id: cache-data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: empyrean-data-v2

      - name: Download empyrean data kernels
        if: steps.cache-data.outputs.cache-hit != 'true'
        # Retry transient network failures instead of failing the whole
        # suite: --retry-all-errors covers connection timeouts (curl exit
        # 28, seen when naif.jpl.nasa.gov is briefly unreachable), and
        # --connect-timeout caps a single hung attempt so it fails fast
        # into the next retry rather than stalling for minutes.
        run: |
          mkdir -p data
          cd data
          get() { curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 60 "$@"; }
          get -o de440.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440.bsp
          get -o gm_de440.tpc https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/gm_de440.tpc
          get -o earth_latest_high_prec.bpc https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/earth_latest_high_prec.bpc
          get -o earth_620120_250826.bpc https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/earth_620120_250826.bpc
          get -o earth_2025_250826_2125_predict.bpc https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/earth_2025_250826_2125_predict.bpc
          get -o moon_pa_de440_200625.bpc https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/moon_pa_de440_200625.bpc
          get -o sb441-n16.bsp https://ssd.jpl.nasa.gov/ftp/eph/small_bodies/asteroids_de441/sb441-n16.bsp
          get https://minorplanetcenter.net/Extended_Files/obscodes_extended.json.gz | gunzip > obscodes_extended.json
          get -o linux_p1550p2650.440 https://ssd.jpl.nasa.gov/ftp/eph/planets/Linux/de440/linux_p1550p2650.440

      # Runs only on a fresh, successful download (a bare `if:` implies
      # success()), so the cache is populated exactly once per key with a
      # complete kernel set — never a partial one from a failed run.
      - name: Save empyrean data kernels
        if: steps.cache-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: empyrean-data-v2

      # JPL Horizons + SBDB API responses — the rust runner caches every
      # IC and reference vector the first time it fetches them, so warm
      # CI runs avoid hammering JPL's servers.
      - name: Cache JPL API responses
        uses: actions/cache@v4
        with:
          path: ~/.empyrean/cache
          key: empyrean-api-cache-v1

      # Cargo registry + workspace targets across all sibling repos. Key
      # on every Cargo.toml / Cargo.lock so any dep bump invalidates.
      - name: Cache cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            empyrean/target
            empyrean-core/target
            empyrean-validation/target
          key: cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-

      # ASSIST venv — assist + rebound take ~30 seconds to install
      # cleanly from PyPI; cache the resolved venv across runs.
      - name: Cache ASSIST venv
        uses: actions/cache@v4
        with:
          path: empyrean-validation/runners/assist/.venv
          key: assist-venv-${{ hashFiles('empyrean-validation/runners/assist/setup.sh') }}

      # find_orb is a from-source build of four C/C++ libraries (lunar,
      # jpl_eph, sat_code, find_orb). Cache the build tree + install
      # prefix, otherwise it's ~5 minutes of compile every run.
      - name: Cache find_orb build
        id: cache-findorb
        uses: actions/cache@v4
        with:
          path: |
            empyrean-validation/runners/findorb/build
            empyrean-validation/runners/findorb/install
            ~/include
            ~/lib
          key: findorb-build-v5

      # ── Pipeline ───────────────────────────────────────────────
      # `make setup` only runs the per-runner setup scripts that produce
      # things the cache might not have (or that are cheap to re-check).
      - name: One-time external setup (ASSIST venv + find_orb build)
        working-directory: empyrean-validation
        env:
          DATA_DIR: ${{ env.EMPYREAN_DATA_DIR }}
        run: make setup

      # `make all` = build + run + report. The Makefile owns every detail
      # of the pipeline — channel order, perturber exclusion, plan
      # derivation, merge-external, report renderer invocation. CI just
      # passes through OBJECTS / TIERS as overrides.
      - name: make all
        working-directory: empyrean-validation
        env:
          DATA_DIR: ${{ env.EMPYREAN_DATA_DIR }}
        run: make all OBJECTS="${OBJECTS}" TIERS="${TIER}"

      # ── Hard gate ──────────────────────────────────────────────
      # python and core are both expected to be bit-exact to the rust
      # reference at 1e-10 fidelity. python tests that the PyO3 bridge
      # round-trips without precision loss; core tests that the FFI
      # surface (rust) and the direct engine surface (core) don't drift apart
      # on the v0.7.0 ODConfig defaults. A failure here usually means a
      # config-default regression in either the wrapper or the engine.
      - name: ci-check (gate on python + core parity)
        working-directory: empyrean-validation
        run: |
          ./target/release/empyrean-validation ci-check \
            --summary results/validation_summary.json \
            --strict-channels python,core

      # ── GCS upload ─────────────────────────────────────────────
      - name: Authenticate to Google Cloud
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/786706985139/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "empyrean-ci@empyrean-dynamics.iam.gserviceaccount.com"

      - name: Upload to GCS
        if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: empyrean-validation
        run: |
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)

          # GCS layout consumed by the app's validation page
          # (https://validation.empyrean-dynamics.com/latest/...):
          #
          #   latest/validation.json         ← merged rust prop+eph (canonical, backwards-compat)
          #   latest/od_validation.json      ← rust OD (canonical, backwards-compat)
          #   latest/channels/{rust,python,core,assist,findorb}.json
          #   latest/validation_report.html
          #   latest/validation_summary.json
          #
          # archive/{TIMESTAMP}/ mirrors the same structure for history.

          alias_canonical() { cp "$1" "$2"; }
          alias_canonical results/validation_rust_merged.json results/validation.json
          alias_canonical results/validation_rust_od.json      results/od_validation.json

          # latest/ — overwrite each upload
          gcloud storage rm -r ${{ env.GCS_BUCKET }}/latest/ 2>/dev/null || true
          gcloud storage cp results/validation.json            ${{ env.GCS_BUCKET }}/latest/validation.json
          gcloud storage cp results/od_validation.json         ${{ env.GCS_BUCKET }}/latest/od_validation.json
          gcloud storage cp results/validation_report.html     ${{ env.GCS_BUCKET }}/latest/validation_report.html
          gcloud storage cp results/validation_summary.json    ${{ env.GCS_BUCKET }}/latest/validation_summary.json
          for ch in rust python core assist findorb; do
            f="results/validation_${ch}.json"
            [ -f "$f" ] && gcloud storage cp "$f" "${{ env.GCS_BUCKET }}/latest/channels/${ch}.json"
          done

          # archive/ — historical
          gcloud storage cp results/validation.json            ${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/validation.json
          gcloud storage cp results/od_validation.json         ${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/od_validation.json
          gcloud storage cp results/validation_report.html     ${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/validation_report.html
          gcloud storage cp results/validation_summary.json    ${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/validation_summary.json
          for ch in rust python core assist findorb; do
            f="results/validation_${ch}.json"
            [ -f "$f" ] && gcloud storage cp "$f" "${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/channels/${ch}.json"
          done

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            empyrean-validation/results/validation_report.html
            empyrean-validation/results/validation_summary.json
            empyrean-validation/results/*.json
          retention-days: 30

      - name: Step summary
        working-directory: empyrean-validation
        run: |
          echo "## Validation Suite — ${TIER} tier" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          s = json.load(open('results/validation_summary.json'))
          print('| channel | rows | pass @ 1e-10 | max Δpos km | p50 t (ms) | speed |')
          print('|---------|-----:|:-------------|------------:|-----------:|------:|')
          for ch in s['channels']:
              passing = ch['n_passing']; total = ch['n_total_compared']
              pass_str = '—' if total == 0 else f\"{passing}/{total}\"
              dpos = ch.get('max_pos_diff_km', 0.0)
              p50 = ch.get('p50_time_ms') or 0
              ratio = ch.get('p50_speed_ratio') or 1.0
              print(f\"| {ch['channel']} | {ch['n_rows']} | {pass_str} | {dpos:.2e} | {p50:.1f} | {ratio:.2f}x |\")
          " >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Report uploaded to \`${{ env.GCS_BUCKET }}/latest/validation_report.html\`" >> $GITHUB_STEP_SUMMARY
