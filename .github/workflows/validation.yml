name: Validation Suite

# Centralized in empyrean-validation because the framework owns the
# pipeline (schema, catalog, plan, report, ci-check, external-reference
# runners). Per-channel runners (rust / python / c / cli / core) still
# live in the repos whose surface they exercise — empyrean and
# empyrean-core — and are checked out here as siblings.
#
# ── Pipeline shape (matrix fan-out) ────────────────────────────────
#
#   precheck ─► prep ─► reference ×50 ─► assemble ─┬─► empyrean ────┐
#                       (one leg per object)        │                ├─► reduce
#                                                   └─► external ×N ─┘
#
#   • prep   — build the engine and harness binaries, sync the kernel set, and
#              fetch the pinned inputs snapshot (SBDB, Horizons, ADES PSVs)
#              from the suite's public validation bucket ONCE (plain HTTPS, no
#              credential) into the shared caches, then emit the per-object
#              fan-out matrix from the catalog. It no longer queries JPL/MPC
#              live and no longer runs the reference itself; the ONLY workflow
#              that reaches JPL/MPC is the manual mint-inputs action. Every
#              other job restores the inputs snapshot from the actions cache by
#              snapshot id (no credential) and then seals the JPL/MPC hosts
#              before running.
#   • reference — one matrix leg per catalog object, each running prop+eph +
#              OD for its single object into a shard artifact. Running all
#              three axes over the whole catalog in ONE job took 176 min and
#              blew the 180-minute ceiling, discarding ~3 hours of completed
#              fits (empyrean-qhhw). Per object rather than N balanced shards
#              because fit cost is not predictable from any cheap proxy —
#              Didymos fits 6,034 observations in 25.4 min, Eros fits 13,150
#              in 47 s — so a weight table would silently unbalance whenever
#              the engine or catalog moved. Legs restore prep's caches
#              read-only and fail on a miss rather than re-downloading 2 GB
#              of kernels 50 times. fail-fast:false, so one pathological
#              object cannot cancel the other 49.
#   • assemble — the fan-in: reassemble every shard into the canonical
#              reference, then strip it into validation_plan.json. Checks the
#              arrived shard set against the catalog and fails NAMING any
#              absent object — a report built from 49 of 50 objects is
#              otherwise indistinguishable from a complete one. Runs on
#              always() so a dead leg produces that named error instead of a
#              skipped job.
#   • empyrean — the four remaining distribution channels (python / c / cli /
#              core) that need the private empyrean + empyrean-core source
#              built; they share one build so they run together in a single
#              job. The rust channel is the reference and is produced by the
#              `reference` matrix above.
#   • external — one matrix leg per independent reference implementation
#              (ASSIST, find_orb, OpenOrb, kete, jorbit, layup, OrbFit).
#              Each replays the *prebuilt* plan; needs no secrets and no
#              private checkout. fail-fast:false so one dead comparator
#              never sinks the others — its channel just goes missing
#              from the report, loudly, never faked.
#   • reduce — merge every staged channel JSON + render the report +
#              gate (ci-check) + publish to GCS.
#
# Every leg restores the same keyed caches (data kernels, JPL API
# responses, cargo, per-tool build trees) that `prep` populates, so the
# expensive downloads/builds happen once and fan out warm.
#
# Triggers
# ──────────────────────────────────────────────────────────────────
# This run costs ~55 jobs and hours of compute, so it fires only when
# the thing it measures — the empyrean engine as the distribution
# channels see it — has actually moved, or when someone asks:
#
#   - push                — this repo's main bumped the empyrean pin
#                           in its OWN dependencies (see "Pin-bump
#                           push" below). The harness adopted a new
#                           engine generation. Every channel builds
#                           that pinned release (the sibling checkout
#                           is pinned to its tag), so this is the one
#                           automatic trigger.
#   - dispatch            — manual run with optional OBJECTS / TIER
#                           inputs; the escape hatch for everything
#                           else, and how a published run is started.
#
# DELIBERATELY NOT TRIGGERS, each dropped with its coverage story:
#
#   - the weekly cron. It re-ran an unchanged stack against upstream
#     comparators that mostly drift on their own schedule. What it
#     did buy was drift detection on the four UNPINNED comparators
#     (find_orb @ HEAD, kete / jorbit @ latest PyPI, OrbFit @
#     :latest); that signal now comes from upstream-scan.yml's
#     Monday 07:00 UTC report, which surfaces the drift without
#     spending the suite on it. Consequence, stated plainly: a
#     comparator can move and stay unexercised until the next
#     empyrean change or a manual run.
#
#   - sibling pushes to main (empyrean, empyrean-core, and before
#     them the engine repos' tag pushes). Both `sibling-main-push`
#     and `sibling-tag-push` dispatches once ran this suite; neither
#     is accepted now. The channels build the release the manifests
#     pin, from a sibling checkout pinned to that tag, so a sibling's
#     main moving changes nothing this suite builds: a dispatch spent
#     a full run re-validating the same release and republished an
#     identical dashboard. An engine reaches this suite when its pin
#     moves here — the push trigger above — which is the transition
#     that reaches users.
#
#   - framework-only pushes (schema, report renderer, external-runner
#     code, the orchestrator Makefile, or this workflow itself).
#     Those still get this repo's own CI on every push and PR —
#     build, clippy, unit tests, and `make lint-workflows`
#     (actionlint), which is what catches the dangerous
#     silently-skipped-job class in this file. End-to-end exercise of
#     a framework change is a `workflow_dispatch` away.
#
# Pin-bump push
# ──────────────────────────────────────────────────────────────────
# The `paths` filter below lists the three manifests carrying the
# exact empyrean pin: the harness, the rust runner, and the CLI
# runner. `Cargo.lock` is deliberately NOT in that list. The pins are
# exact (`empyrean = "=x.y.z"`), so the lock cannot move empyrean
# without one of these three manifests moving too — listing the lock
# would add nothing about empyrean while firing the whole suite on
# every unrelated transitive bump (serde, clap, chrono).
#
# The filter is path-level, not diff-level: an unrelated edit to one
# of these manifests (a harness version bump, a new dev-dependency)
# also fires the suite. That is the accepted false-positive side of
# the trade — these files change rarely, and a spurious full run is a
# far better failure than a missed pin bump. If it ever becomes
# noisy, the fix is a guard step that diffs the pin line, not a
# narrower path list.
#
# The python / c / cli / core channels build from the SIBLING
# empyrean checkout (Makefile: EMPYREAN_ROOT), which the channel job
# and the engine-setup action check out at the tag of the version the
# runner manifest pins, so the pin-bump push covers them too.

on:
  workflow_dispatch:
    inputs:
      objects:
        description: "Subset of objects to validate (comma-separated; empty = all)"
        type: string
        default: ""
      tier:
        description: "Force model tier (approximate / basic / standard)"
        type: string
        default: "standard"
  push:
    branches: [main]
    # The empyrean pin, and nothing else. See "Pin-bump push" above for why
    # Cargo.lock is absent and why this is path-level rather than diff-level.
    paths:
      - "Cargo.toml"
      - "runners/rust/Cargo.toml"
      - "runners/cli/Cargo.toml"

# Default to read-only for EVERY job. id-token:write (which mints the GCP
# OIDC token) is granted ONLY to the reduce job that publishes to GCS — never
# workflow-wide, because the external matrix legs build and run untrusted
# upstream tool code and must not be able to exchange an OIDC token for the
# empyrean-ci service account.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  GCS_BUCKET: gs://empyrean-validation
  EMPYREAN_DATA_DIR: ${{ github.workspace }}/data
  # The numerical-parity suite runs on a single interpreter by design: the
  # empyrean python channel ships as an abi3 wheel, so its compiled binary is
  # byte-identical across CPython 3.10–3.14 — running the (expensive) suite per
  # version would add cost with no signal. Per-version *Python* coverage lives in
  # the empyrean repo's own CI (lint + mypy + tests across the support range).
  PYTHON_VERSION: "3.12"
  # Empty OBJECTS = the full 50-object catalog. Every trigger (push, cron,
  # sibling dispatch) validates the complete catalog; pass a comma-separated
  # subset via workflow_dispatch `objects` for a quick targeted run.
  OBJECTS: ${{ inputs.objects || '' }}
  # Object chunks per channel leg (scripts/channel-chunks.py); capped at the
  # object count, so a subset dispatch fans out no wider than its objects.
  CHANNEL_CHUNKS: "10"
  TIER: ${{ inputs.tier || 'standard' }}
  # Shared cache keys — every job restores by these exact keys so the
  # downloads/builds `prep` populates fan out warm. Bump a version suffix
  # when the underlying artifact set changes.
  # The registered kernel set every empyrean repo pins (lang/workflow/gcp-project.md).
  EMPYREAN_DATASET: kernels-full-2026-10-13
  EMPYREAN_OFFLINE: "1"

jobs:
  # The full suite needs the empyrean wrapper repo for the rust /
  # python / c / cli channel runners, and that repo has no public push
  # yet (its first publish rides the wrapper release). Until it
  # exists, skip the suite cleanly instead of failing on the sibling
  # checkout — a red run here must mean broken validation, not an
  # unpublished sibling. The probe makes the suite resume
  # automatically on the wrapper repo's first push.
  precheck:
    name: Sibling availability
    runs-on: ubuntu-latest
    outputs:
      empyrean-available: ${{ steps.probe.outputs.available }}
    steps:
      - name: Probe for the empyrean wrapper repo
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Split the axes on the HTTP status: a 404 genuinely means the
          # wrapper repo is not published yet (skip the suite cleanly); a
          # 401/403/5xx/000 means an expired-PAT or network failure and MUST
          # fail loudly, never silently disable the release gate by mapping
          # every non-200 to "unavailable".
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Empyrean-Dynamics/empyrean || echo 000)
          echo "Probe HTTP status: $code"
          case "$code" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=Validation suite skipped::Empyrean-Dynamics/empyrean is not published yet; the full-channel suite resumes automatically once the wrapper repo exists."
              ;;
            *)
              echo "::error title=Validation precheck failed::Probing Empyrean-Dynamics/empyrean returned HTTP $code (not 200/404) — likely an expired GH_PAT or a GitHub API outage. Failing loudly rather than silently disabling the suite."
              exit 1
              ;;
          esac

  # ── prep ───────────────────────────────────────────────────────────
  # Download + cache all shared data ONCE, build the rust reference, and
  # emit the canonical plan. This is the only job that hits the network
  # (NAIF/JPL/SBDB) and the only one besides `empyrean` that carries the
  # private-engine checkout. Everything downstream restores the caches it
  # populates and consumes the plan artifact it uploads.
  prep:
    name: Prep — data + rust reference + plan
    needs: precheck
    if: needs.precheck.outputs.empyrean-available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # Workload Identity Federation, read-only kernel bucket
    timeout-minutes: 90
    outputs:
      # The per-object fan-out matrix, generated from the catalog.
      objects: ${{ steps.objects.outputs.objects }}
      # The same objects dealt into chunks for the channel legs, and how many.
      chunks: ${{ steps.objects.outputs.chunks }}
      chunk_count: ${{ steps.objects.outputs.chunk_count }}
      # snapshot_id of the pinned inputs snapshot, read from the manifest.
      # Every downstream job keys the inputs cache on this (prep is the sole
      # writer), so they all restore exactly what prep fetched.
      inputs_id: ${{ steps.inputs-id.outputs.id }}
    steps:
      - name: Log trigger source
        run: |
          echo "Event: ${{ github.event_name }}"

      # This repo must land before the composite action below can be resolved:
      # the action lives inside it, and `uses: ./...` only resolves a path that
      # is already on disk.
      - name: Checkout empyrean-validation (default)
        uses: actions/checkout@v4
        with:
          path: empyrean-validation

      # The pinned inputs snapshot id, read once here and exported as a job
      # output so every downstream job keys the inputs cache identically. A
      # composite action cannot read `vars` or the repo tree ahead of its own
      # checkout, so the workflow reads the pin and passes the id in.
      - name: Read inputs snapshot id
        id: inputs-id
        working-directory: empyrean-validation
        run: python3 -c "import json; print('id=' + json.load(open('fixtures/manifest.json'))['snapshot_id'])" >> "$GITHUB_OUTPUT"

      # Shared with the per-object `reference` matrix via a composite action, so
      # a leg cannot set its environment up differently from prep and produce
      # reference numbers that silently are not comparable.
      - name: Engine setup (writer — populates the shared caches)
        uses: ./empyrean-validation/.github/actions/engine-setup
        with:
          gh-pat: ${{ secrets.GH_PAT }}
          python-version: ${{ env.PYTHON_VERSION }}
          dataset: ${{ env.EMPYREAN_DATASET }}
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.GCP_DATA_READER_SA }}
          inputs-snapshot-id: ${{ steps.inputs-id.outputs.id }}
          role: writer
          install-python-tooling: "true"

      # ── Build the engine + warm the shared caches ──────────────
      # prep no longer RUNS the reference — it only builds the binaries and
      # populates the caches (2 GB kernels, JPL responses, cargo) that the
      # per-object legs restore. Running all three axes over the whole catalog
      # here is what blew the 180-minute ceiling (empyrean-qhhw).
      #
      # `make build` compiles the binaries (the rust runner's file target is
      # produced by the phony `build-rust`, so a downstream target alone cannot
      # build it) and builds the wheel venv the plan-strip script runs under.
      - name: Build engine + harness binaries
        working-directory: empyrean-validation
        env:
          DATA_DIR: ${{ env.EMPYREAN_DATA_DIR }}
        run: make build

      # The matrix: one entry per catalog object, each carrying the object's
      # catalog name and a filesystem-safe slug. `list-objects` shares its
      # filter resolution with `plan`, so the matrix and the shards cannot
      # disagree about which objects are in scope.
      - name: Emit per-object matrix
        id: objects
        working-directory: empyrean-validation
        run: |
          # Read the matrix from the FILE the target writes, never from make's
          # stdout: make prints its own recipe banners there whenever it has to
          # build the CLI first, and that text ahead of the JSON silently breaks
          # fromJson() and the whole fan-out.
          make list-objects OBJECTS="${OBJECTS}"
          matrix="$(cat results/objects.json)"
          count="$(python3 -c 'import json;print(len(json.load(open("results/objects.json"))))')"
          test "$count" -gt 0 || { echo "ERROR: matrix is empty — no objects to validate." >&2; exit 1; }
          echo "objects=$matrix" >> "$GITHUB_OUTPUT"
          echo "Fanning out $count per-object reference legs."
          chunks="$(python3 scripts/channel-chunks.py split --objects results/objects.json --count "${CHANNEL_CHUNKS}")"
          chunk_count="$(python3 -c 'import json,sys;print(len(json.loads(sys.argv[1])))' "$chunks")"
          echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
          echo "chunk_count=$chunk_count" >> "$GITHUB_OUTPUT"
          echo "Fanning out 4 channels x $chunk_count object chunks."

  # ── reference (per-object matrix) ───────────────────────────────────
  # One leg per catalog object. Each restores the caches prep warmed, rebuilds
  # warm, and runs prop+eph + OD for its single object into a shard artifact.
  #
  # Per object rather than N balanced shards because fit cost is not predictable
  # from any cheap proxy — Didymos fits 6,034 observations in 25.4 min while Eros
  # fits 13,150 in 47 s — so a static shard table would need measured weights and
  # would silently unbalance whenever the engine or catalog moved. One leg per
  # object is generated from the catalog, self-balancing, and confines a crash or
  # timeout to the object that caused it instead of losing the whole run.
  #
  # fail-fast:false so one pathological object does not cancel the other 49;
  # `assemble` is what turns a missing shard into a hard failure, by name.
  reference:
    name: Reference — ${{ matrix.object.name }}
    needs: prep
    runs-on: ubuntu-latest
    # The heaviest object (2020 CD3, a minimoon with Monte Carlo rows) took 37,
    # 51 and then more than 90 minutes on three runs of the same code: runner
    # variance, not a regression. Budget from the measured spread.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # 25 rather than all 50 is free here, and deliberate. Wall-clock is set by
      # the single slowest object (Didymos, ~35 min of fits) not by queue depth:
      # the remaining ~130 min of catalog work spread over 25 slots finishes well
      # inside that, so capping does not extend the run. What it does buy is a
      # halved peak on the 2 GB kernel-cache restore and headroom under the
      # 60-concurrent-job account limit.
      max-parallel: 25
      matrix:
        object: ${{ fromJson(needs.prep.outputs.objects) }}
    steps:
      - name: Checkout empyrean-validation (default)
        uses: actions/checkout@v4
        with:
          path: empyrean-validation
      - name: Engine setup (reader — must restore prep's caches)
        uses: ./empyrean-validation/.github/actions/engine-setup
        with:
          gh-pat: ${{ secrets.GH_PAT }}
          python-version: ${{ env.PYTHON_VERSION }}
          dataset: ${{ env.EMPYREAN_DATASET }}
          inputs-snapshot-id: ${{ needs.prep.outputs.inputs_id }}
          role: reader
      # `build-reference`, not `build`: only the rust runner, the harness CLI and
      # libempyrean are used here. The full `build` measured 375s on a leg, most
      # of it on the C harness, the CLI and the maturin wheel that a reference
      # shard never invokes — and this job runs once per catalog object.
      - name: Build reference prerequisites (warm)
        working-directory: empyrean-validation
        env:
          DATA_DIR: ${{ env.EMPYREAN_DATA_DIR }}
        run: make build-reference
      # Reader role: the inputs snapshot is already restored and verified
      # offline by engine-setup, and this leg downloads nothing from JPL during
      # setup, so seal before the shard run — a cache miss then fails at the
      # socket rather than silently querying live.
      - name: Seal the job from JPL and the MPC
        working-directory: empyrean-validation
        run: ./scripts/seal-upstream.sh
      - name: Reference shard — ${{ matrix.object.name }}
        working-directory: empyrean-validation
        env:
          DATA_DIR: ${{ env.EMPYREAN_DATA_DIR }}
        run: |
          make shard-reference \
            OBJECT="${{ matrix.object.name }}" \
            SLUG="${{ matrix.object.slug }}" \
            TIERS="${TIER}"
      - name: Upload reference shard
        uses: actions/upload-artifact@v4
        with:
          name: reference-shard-${{ matrix.object.slug }}
          path: empyrean-validation/results/shards/${{ matrix.object.slug }}/
          retention-days: 30
          if-no-files-found: error

  # ── assemble ───────────────────────────────────────────────────────
  # Fan-in: reassemble every per-object shard into the canonical reference and
  # strip it into the plan every replay channel reads.
  #
  # This is the job that makes the fan-out safe. `assemble-reference` checks the
  # arrived shard set against the catalog enumeration and fails naming any object
  # that is missing — a report rendered from 49 of 50 objects is otherwise
  # indistinguishable from a complete one. It runs even when legs failed
  # (always()) precisely so it can produce that named error rather than being
  # skipped into silence.
  assemble:
    name: Assemble — reference + plan
    needs: [prep, reference]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout empyrean-validation (default)
        uses: actions/checkout@v4
        with:
          path: empyrean-validation
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: empyrean-validation
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            empyrean-validation/target
          key: cargo-assemble-${{ hashFiles('empyrean-validation/Cargo.lock') }}
          restore-keys: cargo-
      # Only the harness binary is needed here (list-objects + strip-plan);
      # no engine, no kernels, no fixtures.
      - name: Build harness binary
        working-directory: empyrean-validation
        run: cargo build --release --bin empyrean-validation
      - name: Download every reference shard
        uses: actions/download-artifact@v4
        with:
          pattern: reference-shard-*
          path: empyrean-validation/results/shards
      # No flatten step: assemble-reference resolves both the local layout
      # (shards/<slug>/) and the one download-artifact produces
      # (shards/reference-shard-<slug>/). A shell step that normalized one into
      # the other would silently produce nothing if the nesting assumption were
      # wrong — and that assumption cannot be verified outside a real run.
      - name: Show staged shards
        working-directory: empyrean-validation/results/shards
        run: find . -maxdepth 1 -mindepth 1 -type d -print | sort
      # `make plan` reads the pinned Sun/Horizons/SBDB snapshot (the mint's
      # plan step added the per-epoch Sun vectors), so this job restores the
      # inputs cache prep wrote and re-verifies it offline before planning.
      - name: Restore inputs snapshot
        id: cache-inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            empyrean-validation/fixtures/psv
            empyrean-validation/fixtures/psv-radar
            empyrean-validation/fixtures/horizons
            empyrean-validation/fixtures/sbdb
            empyrean-validation/fixtures/MANIFEST.json
          key: inputs-${{ needs.prep.outputs.inputs_id }}
      - name: Verify the pinned inputs snapshot offline
        working-directory: empyrean-validation
        run: make fixtures INPUTS_OFFLINE=1
      # Seal before the plan step: a Horizons/SBDB key missing from the
      # snapshot must fail here, not fetch live.
      - name: Seal the job from JPL and the MPC
        working-directory: empyrean-validation
        run: ./scripts/seal-upstream.sh
      # REFERENCE_ASSEMBLED=1 tells `plan` that the unified reference is already
      # on disk (assemble-reference just wrote it from the shards). Without it,
      # make walks $(RUST) -> $(RUST_PROPEPH)/$(RUST_OD) -> $(RUST_BIN), a file
      # target only the phony `build-rust` produces, and aborts with "No rule to
      # make target .../validate" — this job deliberately carries no engine.
      - name: Assemble reference + strip plan
        working-directory: empyrean-validation
        run: |
          make assemble-reference OBJECTS="${OBJECTS}"
          make plan REFERENCE_ASSEMBLED=1 OBJECTS="${OBJECTS}" TIERS="${TIER}"

      # Stage the plan + the rust channel outputs for the downstream jobs.
      #
      # Including the two JSONL sidecars `validate od` writes next to
      # validation_rust_od.json. They are not channel results, they are the
      # per-object fitted/propagated orbits and the fitted-vs-reference
      # Keplerian Mahalanobis comparisons, and the reduce job's `report` step
      # is the only consumer. Listing only the four JSON files left them in
      # the producing job's workspace and nowhere else, so §12 of every
      # published report — "fitted orbit + covariance vs references" — was
      # empty, not because there was nothing to show but because the data never
      # crossed the job boundary. Same silent-empty family as the OD channel.
      #
      # Every downstream job pulls this artifact whole (`download-artifact` by
      # name, or reduce's merge-multiple), so the sidecars arrive wherever
      # validation_rust_od.json does; there is no per-file download list to
      # extend. The artifact keeps its original name so no consumer changes.
      - name: Upload plan + rust reference
        uses: actions/upload-artifact@v4
        with:
          name: prep-plan-and-rust
          path: |
            empyrean-validation/results/validation_plan.json
            empyrean-validation/results/validation_rust_propeph.json
            empyrean-validation/results/validation_rust_od.json
            empyrean-validation/results/validation_rust.json
            empyrean-validation/results/validation_rust_od_orbits.jsonl
            empyrean-validation/results/validation_rust_od_compare.jsonl
          retention-days: 30
          if-no-files-found: error

  # ── empyrean ───────────────────────────────────────────────────────
  # The four remaining distribution channels (python / c / cli / core)
  # that need the private empyrean + empyrean-core build. rust already ran
  # in prep (it seeds the plan), so this job replays the prebuilt plan
  # through the wheel, the C ABI, the CLI, and empyrean-core direct.
  empyrean:
    name: Empyrean channel — ${{ matrix.channel }} · ${{ matrix.chunk.id }}
    needs: [prep, assemble]
    runs-on: ubuntu-latest
    # One leg per channel per object chunk. The per-method plan replays every
    # uncertainty method on every channel; a single leg per channel does not
    # fit either (run 171, 2026-10-22: python and core were each still
    # replaying at 240 minutes), so the channel job fans out over the chunks
    # prep dealt from the same object matrix the reference legs use. Each leg
    # builds only what its channel links and uploads one chunk file; reduce
    # concatenates the chunks per channel before the merge.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        channel: [python, c, cli, core]
        chunk: ${{ fromJson(needs.prep.outputs.chunks) }}
    steps:
      - name: Checkout empyrean-validation (default)
        uses: actions/checkout@v4
        with:
          path: empyrean-validation
      # The c, python and cli channels build the distribution from this sibling
      # checkout, so it must be the release the manifests pin (runners/rust/
      # Cargo.toml → crates.io), not the default branch, which moves ahead to an
      # unreleased rc and makes `check-engine-version` refuse the build. The
      # engine-setup action pins the same way for the jobs that use it.
      - name: Resolve the pinned distribution version
        id: pinned-engine
        run: |
          version="$(sed -n 's/^empyrean = "=\(.*\)"/\1/p' empyrean-validation/runners/rust/Cargo.toml)"
          if [ -z "$version" ]; then
            echo "ERROR: could not read the pinned empyrean version from empyrean-validation/runners/rust/Cargo.toml." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Pinned distribution: v$version"
      - name: Checkout empyrean (sibling)
        uses: actions/checkout@v4
        with:
          repository: Empyrean-Dynamics/empyrean
          path: empyrean
          ref: v${{ steps.pinned-engine.outputs.version }}
          token: ${{ secrets.GH_PAT }}
      - name: Checkout empyrean-core (sibling)
        uses: actions/checkout@v4
        with:
          repository: Empyrean-Dynamics/empyrean-core
          path: empyrean-core
          token: ${{ secrets.GH_PAT }}
      - name: Checkout core dep (transitive)
        uses: actions/checkout@v4
        with:
          repository: Empyrean-Dynamics/scott
          path: scott
          token: ${{ secrets.GH_PAT }}
      - name: Checkout core dep 2 (transitive)
        uses: actions/checkout@v4
        with:
          repository: Empyrean-Dynamics/villeneuve
          path: villeneuve
          token: ${{ secrets.GH_PAT }}
      - name: Checkout nolan (transitive)
        uses: actions/checkout@v4
        with:
          repository: Empyrean-Dynamics/nolan
          path: nolan
          token: ${{ secrets.GH_PAT }}
      - name: Configure git for any non-patched private deps
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "ssh://git@github.com/"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: |
            empyrean-validation
            empyrean-validation/runners/rust
            empyrean-validation/runners/cli
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv (used by empyrean-py wheel build)
        run: pip install uv

      - name: Restore empyrean data kernels
        uses: actions/cache/restore@v4
        with:
          path: data
          key: empyrean-data-${{ env.EMPYREAN_DATASET }}-set-codes
      - name: Cache cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            empyrean/target
            empyrean-core/target
            empyrean-validation/target
          key: cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: cargo-

      # Inputs snapshot (prep is the sole fetcher): restore by snapshot id and
      # verify offline, no credential. The replay channels fit the pinned PSVs
      # and read the pinned SBDB for the OD comparison.
      - name: Restore inputs snapshot
        id: cache-inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            empyrean-validation/fixtures/psv
            empyrean-validation/fixtures/psv-radar
            empyrean-validation/fixtures/horizons
            empyrean-validation/fixtures/sbdb
            empyrean-validation/fixtures/MANIFEST.json
          key: inputs-${{ needs.prep.outputs.inputs_id }}
      - name: Verify the pinned inputs snapshot offline
        working-directory: empyrean-validation
        run: make fixtures INPUTS_OFFLINE=1

      - name: Download plan + rust reference
        uses: actions/download-artifact@v4
        with:
          name: prep-plan-and-rust
          path: empyrean-validation/results

      # Build the wheel / C ABI / CLI / core binaries, then replay the
      # prebuilt plan through each. PLAN_PREBUILT=1 stops the Makefile
      # from trying to rebuild the rust reference (it lives in prep).
      # Build only what the four replay channels need: the native lib
      # (C/CLI/core link it via DYLD), the C ABI runner, the CLI runner,
      # the wheel, and empyrean-core direct. The rust runner is not built
      # here — it ran in prep and its output is staged.
      - name: Build empyrean distribution artifacts
        working-directory: empyrean-validation
        env:
          DATA_DIR: ${{ env.EMPYREAN_DATA_DIR }}
        run: |
          # The c and cli drivers run under the wheel's virtualenv (the
          # Makefile's WHEEL_VENV python), so those legs build the wheel too.
          case "${{ matrix.channel }}" in
            python) make build-empyrean-c build-wheel ;;
            c)      make build-empyrean-c build-wheel build-c ;;
            cli)    make build-empyrean-c build-wheel build-cli ;;
            core)   make build-core ;;
            *)      echo "unknown channel ${{ matrix.channel }}" >&2; exit 1 ;;
          esac
      # Seal after the builds (which pull only from cargo/crates/pip) and
      # before the replay, which reads the snapshot and must never fetch live.
      - name: Seal the job from JPL and the MPC
        working-directory: empyrean-validation
        run: ./scripts/seal-upstream.sh
      - name: Replay plan — ${{ matrix.channel }}
        working-directory: empyrean-validation
        env:
          OBJECTS: ${{ matrix.chunk.objects }}
          DATA_DIR: ${{ env.EMPYREAN_DATA_DIR }}
        run: |
          make run-${{ matrix.channel }} PLAN_PREBUILT=1 OBJECTS="${OBJECTS}" TIERS="${TIER}"
          mv results/validation_${{ matrix.channel }}.json \
             results/validation_${{ matrix.channel }}.chunk${{ matrix.chunk.id }}.json

      - name: Upload ${{ matrix.channel }} chunk ${{ matrix.chunk.id }}
        uses: actions/upload-artifact@v4
        with:
          name: channel-${{ matrix.channel }}-${{ matrix.chunk.id }}
          path: empyrean-validation/results/validation_${{ matrix.channel }}.chunk${{ matrix.chunk.id }}.json
          retention-days: 30
          if-no-files-found: error

  # ── external ───────────────────────────────────────────────────────
  # One matrix leg per independent reference implementation. Each replays
  # the prebuilt plan through an upstream tool. NO private checkout, NO
  # secrets — these run untrusted-ish upstream code isolated from the PAT
  # and the GCP identity. (The OD fixture fetch below keeps that true:
  # public-read objects over plain HTTPS, no credential involved.)
  # fail-fast:false so a single dead comparator
  # leaves its channel missing from the report (loudly) without sinking
  # the rest of the matrix.
  external:
    name: External — ${{ matrix.tool }}
    # prep is in `needs` only to read its inputs_id output for the cache key —
    # no credential crosses here; the external legs stay secretless. assemble
    # is the real data dependency (the plan artifact).
    needs: [prep, assemble]
    runs-on: ubuntu-latest
    # Budget from the measured pace (run 169, 2026-10-19): the longest green
    # leg was jorbit at 73 min; orbfit, back to one fit per object, is about
    # 80 min at its 1.6 min/fit.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # `oorb` is DISABLED, deliberately — it is not missing from this list
        # by accident, and the oorb-specific steps below are kept in place as
        # the re-enable path.
        #
        # BLOCKER: run_oorb.py needs `ref_sun_pos_au` / `ref_sun_vel_au_d` on
        # each row to convert OpenOrb's heliocentric convention into the
        # plan's SSB frame. Only `empyrean-validation plan` populates those;
        # the plan this workflow uses is stripped from the rust runner's
        # output, which never does. Measured: 0 of 652 rust rows and 0 of 448
        # plan rows carry the key, so 100% of oorb's rows skip. The keys
        # cannot simply be added to the plan whitelist — they are not in the
        # v0.7.0 schema empyrean-core pins, so carrying them reintroduces the
        # deny_unknown_fields break the whitelist strip exists to kill.
        #
        # The leg was previously green while computing nothing (a pass-through
        # of untouched plan rows, exit 0). run_oorb.py now exits nonzero on a
        # 100% skip, which is honest and is deliberately LEFT IN PLACE — but
        # it makes this leg permanently red, and a permanently-red leg trains
        # people to ignore red. So the leg is off, by decision, with the
        # blocker named: neither faking a pass nor crying wolf.
        #
        # RE-ENABLE (empyrean-jg3o): tag the validation schema -> re-pin
        # empyrean-core -> populate ref_sun_* in the rust runner or the strip
        # -> add `oorb` back to this list and set WITH_OORB=1 in the Makefile.
        # Until then reduce prints a DISABLED line naming this reason, so the
        # channel's absence from the report is explained rather than guessed
        # at.
        tool: [assist, findorb, kete, jorbit, layup, orbfit, grss]
    steps:
      - name: Checkout empyrean-validation (default)
        uses: actions/checkout@v4
        with:
          path: empyrean-validation

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore empyrean data kernels
        uses: actions/cache/restore@v4
        with:
          path: data
          key: empyrean-data-${{ env.EMPYREAN_DATASET }}-set-codes

      # One cache per tool build tree. The path list is a superset (venv /
      # install / build + find_orb's ~/include ~/lib); absent members are
      # simply not cached. It ALSO caches runners/assist/.venv because the
      # find_orb and OpenOrb runners execute under the ASSIST interpreter
      # ($(ASSIST_PY) is a prerequisite of run-findorb / run-oorb), so those
      # two legs build the assist venv too — the key hashes both the tool's
      # and assist's setup.sh so either changing invalidates it. OrbFit is a
      # Docker pull with no on-disk tree here — not cached (native amd64 makes
      # the fit fast; the ~3 GB pull is a candidate for docker-layer caching).
      - name: Cache tool build
        if: matrix.tool != 'orbfit'
        uses: actions/cache@v4
        with:
          path: |
            empyrean-validation/runners/${{ matrix.tool }}/.venv
            empyrean-validation/runners/${{ matrix.tool }}/install
            empyrean-validation/runners/${{ matrix.tool }}/build
            empyrean-validation/runners/assist/.venv
            ~/include
            ~/lib
          key: ${{ matrix.tool }}-${{ hashFiles(format('empyrean-validation/runners/{0}/setup.sh', matrix.tool), 'empyrean-validation/runners/assist/setup.sh') }}

      # OpenOrb's Fortran build links LAPACK/BLAS, not present by default.
      # Inert while `oorb` is off the matrix (see the DISABLED note there);
      # kept so re-enabling is one list edit rather than an archaeology
      # exercise.
      - name: Install LAPACK/BLAS (OpenOrb only)
        if: matrix.tool == 'oorb'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblapack-dev libblas-dev

      # Inputs snapshot (prep is the sole fetcher): restore by snapshot id and
      # verify offline. No gcloud, no PAT, no GCP identity — this leg stays
      # exactly as secretless as it was when the fixtures rode the checkout.
      - name: Restore inputs snapshot
        id: cache-inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            empyrean-validation/fixtures/psv
            empyrean-validation/fixtures/psv-radar
            empyrean-validation/fixtures/horizons
            empyrean-validation/fixtures/sbdb
            empyrean-validation/fixtures/MANIFEST.json
          key: inputs-${{ needs.prep.outputs.inputs_id }}
      - name: Verify the pinned inputs snapshot offline
        working-directory: empyrean-validation
        run: make fixtures INPUTS_OFFLINE=1

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: prep-plan-and-rust
          path: empyrean-validation/results

      # find_orb and OpenOrb run under the ASSIST venv interpreter, so their
      # legs must build it explicitly (their `make run-*` would otherwise
      # trigger an uncached assist pip build mid-run, coupling all three
      # comparators to assist-setup health). Other tools are self-contained.
      # The `oorb` half of the case is inert while that leg is off the matrix
      # and, like the LAPACK step, is kept as the re-enable path.
      - name: Setup ${{ matrix.tool }}
        working-directory: empyrean-validation
        env:
          DATA_DIR: ${{ env.EMPYREAN_DATA_DIR }}
        run: |
          case "${{ matrix.tool }}" in
            findorb|oorb) make setup-assist setup-${{ matrix.tool }} ;;
            *)            make setup-${{ matrix.tool }} ;;
          esac

      # Seal AFTER tool setup — GRSS's setup.sh still downloads two kernels
      # from ssd.jpl.nasa.gov — and before the run, which reads only the
      # pinned snapshot.
      - name: Seal the job from JPL and the MPC
        working-directory: empyrean-validation
        run: ./scripts/seal-upstream.sh

      - name: Run ${{ matrix.tool }}
        working-directory: empyrean-validation
        env:
          DATA_DIR: ${{ env.EMPYREAN_DATA_DIR }}
        run: make run-${{ matrix.tool }} PLAN_PREBUILT=1 OBJECTS="${OBJECTS}" TIERS="${TIER}"

      # Upload whatever this leg produced. find_orb emits two files
      # (optical + radar); the glob covers per-tool naming without a
      # per-tool branch. if-no-files-found:error so a leg that ran but
      # produced nothing fails visibly rather than uploading an empty
      # artifact the reduce step would silently treat as "channel absent".
      - name: Upload ${{ matrix.tool }} channel output
        uses: actions/upload-artifact@v4
        with:
          name: channel-${{ matrix.tool }}
          path: |
            empyrean-validation/results/validation_${{ matrix.tool }}.json
            empyrean-validation/results/validation_${{ matrix.tool }}_radar.json
          retention-days: 30
          if-no-files-found: error

  # ── reduce ─────────────────────────────────────────────────────────
  # Merge every staged channel JSON + render the report + gate + publish.
  # Runs whenever the reference/plan and the empyrean channels succeeded, EVEN
  # IF some external legs failed (always() + explicit result checks): the report
  # then simply omits the dead comparators, which is the honest outcome.
  #
  # The gate names `assemble`, which is what now produces the plan, and which
  # already refuses to succeed unless prep succeeded and every shard arrived —
  # so prep is covered transitively. It must name a job that is actually in
  # `needs`: the `needs` context contains ONLY direct dependencies, so a
  # leftover `needs.prep.result` here would read null, the ANDed always() could
  # not rescue it, and reduce would be SKIPPED on every run — dropping the
  # report, the ci-check row floors and the publish while the workflow still
  # reported success. `make lint-workflows` catches exactly that mismatch.
  reduce:
    name: Reduce — merge + report + publish
    needs: [prep, assemble, empyrean, external]
    if: always() && needs.assemble.result == 'success' && needs.empyrean.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The only job that publishes to GCS, so the only one that may mint the
    # OIDC token. Kept off the workflow-level grant so the untrusted external
    # legs never inherit it.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout empyrean-validation (default)
        uses: actions/checkout@v4
        with:
          path: empyrean-validation

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: empyrean-validation
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # merge-external reads the pinned SBDB snapshot for JPL reference
      # elements. Restore by snapshot id (prep is the sole fetcher) and verify
      # offline — no credential.
      - name: Restore inputs snapshot
        id: cache-inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            empyrean-validation/fixtures/psv
            empyrean-validation/fixtures/psv-radar
            empyrean-validation/fixtures/horizons
            empyrean-validation/fixtures/sbdb
            empyrean-validation/fixtures/MANIFEST.json
          key: inputs-${{ needs.prep.outputs.inputs_id }}
      - name: Verify the pinned inputs snapshot offline
        working-directory: empyrean-validation
        run: make fixtures INPUTS_OFFLINE=1
      - name: Cache cargo state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            empyrean-validation/target
          key: cargo-${{ hashFiles('empyrean-validation/**/Cargo.lock', 'empyrean-validation/**/Cargo.toml') }}
          restore-keys: cargo-

      # Pull the plan/reference and the channel artifacts flat into results/.
      # merge-multiple flattens each single-file artifact into the one results dir.
      #
      # These are two EXPLICIT patterns, not a blanket download, because the run
      # now also carries 50 `reference-shard-<slug>` artifacts and every one of
      # them contains files named validation_rust_propeph.json,
      # validation_rust_od.json and the two sidecars. Flattened together with
      # merge-multiple they would collide on those names and overwrite the
      # assembled full-catalog reference with whichever single object's shard
      # landed last — a report built from one object while looking complete.
      # The shards were already consumed by `assemble`; reduce must not see them.
      - name: Download plan + assembled reference
        uses: actions/download-artifact@v4
        with:
          name: prep-plan-and-rust
          path: empyrean-validation/results
      - name: Download channel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: channel*
          path: empyrean-validation/results
          merge-multiple: true

      - name: List staged channels
        working-directory: empyrean-validation
        run: ls -la results/

      # Each channel arrives as one file per object chunk; put it back
      # together before the merge, refusing a short channel.
      - name: Assemble channel chunks
        working-directory: empyrean-validation
        run: |
          for ch in python c cli core; do
            python3 scripts/channel-chunks.py concat \
              --out "results/validation_${ch}.json" \
              --expect "${{ needs.prep.outputs.chunk_count }}" \
              results/validation_${ch}.chunk*.json
          done

      # Seal before the merge: merge-external reads only the pinned SBDB
      # snapshot, never JPL live. The later GCS publish uses
      # storage.googleapis.com, which the seal deliberately does not block.
      - name: Seal the job from JPL and the MPC
        working-directory: empyrean-validation
        run: ./scripts/seal-upstream.sh

      # reduce builds only the harness, then folds in whichever external
      # channels are present (skipping any that a failed leg left absent).
      # WITH_CORE=1 so REPORT_INPUTS is core-keyed (the empyrean job always
      # produces core under a precheck-gated run).
      - name: Merge + report
        working-directory: empyrean-validation
        run: make reduce PLAN_PREBUILT=1 WITH_CORE=1

      # Per-axis row floors, not just aggregate parity. Without them the gate
      # passes on "orbit_determination: 0 compared", which is how a dead OD
      # channel stayed green for the life of this repo.
      #
      # `--catalog-floors` derives the numbers instead of restating them: one
      # orbit_determination row per catalog object, one
      # orbit_determination_radar row per manifest-pinned radar fixture. They used to
      # be spelled here as 50 and 5, coupled to the catalog by nothing at all,
      # so adding a catalog object silently under-strictened the gate — the
      # floor stayed at the old count and the new object's absence from the OD
      # axis would have passed. `ci-check` reads
      # empyrean_validation::catalog for both, and unit tests pin the catalog
      # length and the radar-fixture list to the tree.
      #
      # The radar floor lands on `rust` alone — DELIBERATE and TEMPORARY, see
      # empyrean-s1ab. The radar rows ride the plan and the python and cli
      # drivers replay them, but the reference channel (empyrean-core's
      # validate-core) has no optical+radar arm: it declines the row and emits
      # none, so no channel's radar row is ever compared, and a strict-channel
      # floor on the axis would fail forever for work the reference cannot
      # judge. Gating the rows where they are produced for certain keeps the
      # radar work under a floor instead of quietly un-gating it. When the
      # reference grows a radar arm, move the floor back.
      #
      # Floors are only applied on a full-catalog run: a workflow_dispatch
      # with an OBJECTS subset legitimately produces fewer rows, and a floor
      # that fires on a deliberate subset would train everyone to ignore it.
      - name: ci-check (gate on python + core parity and OD row floors)
        working-directory: empyrean-validation
        run: |
          if [ -z "${OBJECTS}" ]; then
            FLOORS="--catalog-floors"
            echo "Full catalog run — enforcing the catalog-derived per-axis floors."
          else
            FLOORS=""
            echo "::warning title=OD row floors not enforced::OBJECTS='${OBJECTS}' is a subset, so the per-axis ci-check floors are skipped for this run."
          fi
          ./target/release/empyrean-validation ci-check \
            --summary results/validation_summary.json \
            --strict-channels python,core \
            ${FLOORS}

      # ── GCS upload ─────────────────────────────────────────────
      # Publish on every real trigger (a pin-bump push or a manual dispatch;
      # the retired sibling dispatch used to be one too, and omitting a real
      # trigger here once left the bucket stale while the summary claimed a
      # publish).
      #
      # But NOT from every ref, and NOT for every object set. `latest/` is the
      # published dashboard: whatever lands there is read as "this is Empyrean's
      # validation of record." Two ways that was reachable by a run that has no
      # business claiming it:
      #
      #   - a workflow_dispatch from ANY branch published over main's results,
      #     so testing a pipeline change republished the dashboard from the
      #     branch under test;
      #   - a subset run (OBJECTS=…) published a partial report as canonical.
      #     ci-check already refuses to enforce its per-axis row floors on a
      #     subset — it warns and skips them — so the suite already knows a
      #     subset is not gate-worthy, yet it published one as the gate anyway.
      #
      # Both are decided here, once, so the auth step and the upload step cannot
      # disagree about whether this run is allowed to publish.
      - name: Decide whether this run may publish
        id: publish-gate
        run: |
          trigger=0
          # `schedule` is inert while the weekly cron is off (see "Triggers"
          # at the top) and is kept here ON PURPOSE, the same way the oorb
          # re-enable path is kept below. This gate is the narrower of the two
          # lists, so a cron restored in `on:` without a matching edit here
          # would run the full suite and then silently decline to publish it.
          case "${{ github.event_name }}" in
            schedule|push|workflow_dispatch) trigger=1 ;;
          esac
          if [ "$trigger" -ne 1 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Not publishing: ${{ github.event_name }} is not a publishing trigger."
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Not publishing::ref is ${{ github.ref }}, not refs/heads/main — results stay as run artifacts so a branch under test cannot overwrite the published dashboard."
          elif [ -n "${OBJECTS}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Not publishing::OBJECTS='${OBJECTS}' is a subset, so this run is not the validation of record. ci-check already skips its row floors for subsets; publishing one as latest/ would contradict that."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing: full catalog on refs/heads/main via ${{ github.event_name }}."
          fi
      - name: Authenticate to Google Cloud
        if: steps.publish-gate.outputs.publish == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/786706985139/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "empyrean-ci@empyrean-dynamics.iam.gserviceaccount.com"
      - name: Upload to GCS
        if: steps.publish-gate.outputs.publish == 'true'
        working-directory: empyrean-validation
        run: |
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          alias_canonical() { cp "$1" "$2"; }
          if [ -f results/validation_core_merged.json ]; then
            alias_canonical results/validation_core_merged.json results/validation.json
          else
            alias_canonical results/validation_rust_merged.json  results/validation.json
          fi
          alias_canonical results/validation_rust_od.json      results/od_validation.json

          # No `gcloud storage rm -r latest/` before the copies. Every object
          # below is overwritten by name, so the delete removed nothing the
          # copy would not have replaced — it only opened a window in which
          # the published dashboard was a 404. A per-channel file for a
          # comparator that stopped running does go stale rather than
          # vanishing, which is the one thing the delete bought; the report
          # states which channels ran, and a stale sibling object is a far
          # smaller problem than an empty bucket mid-publish.
          #
          # ONE OUTSTANDING CONSEQUENCE of that trade, now that `oorb` is a
          # deliberately disabled leg: `latest/channels/oorb.json` in the
          # bucket is whatever the last green-but-computed-nothing run put
          # there — a pass-through of untouched plan rows tagged
          # channel="oorb". It is not overwritten because the file is no
          # longer produced. Nothing in this workflow deletes published
          # objects, and adding a delete here is a production-data action that
          # wants a human, so this is recorded rather than automated: the
          # stale object should be removed out of band as part of
          # empyrean-jg3o. The loop below is left listing `oorb` so the
          # re-enable path needs no edit; `[ -f ]` skips it meanwhile.
          gcloud storage cp results/validation.json            ${{ env.GCS_BUCKET }}/latest/validation.json
          gcloud storage cp results/od_validation.json         ${{ env.GCS_BUCKET }}/latest/od_validation.json
          gcloud storage cp results/validation_report.html     ${{ env.GCS_BUCKET }}/latest/validation_report.html
          gcloud storage cp results/validation_report.data.json ${{ env.GCS_BUCKET }}/latest/validation_report.data.json
          # The predictive-power timelines (Part 4.2) travel as a second sidecar the
          # page fetches beside itself; absent when the run carried no walk aggregate.
          if [ -f results/validation_report.predict.json ]; then
            gcloud storage cp results/validation_report.predict.json "${{ env.GCS_BUCKET }}/latest/validation_report.predict.json"
          fi
          gcloud storage cp results/validation_summary.json    ${{ env.GCS_BUCKET }}/latest/validation_summary.json
          for ch in rust python c cli core assist findorb oorb kete jorbit layup orbfit; do
            f="results/validation_${ch}.json"
            [ -f "$f" ] && gcloud storage cp "$f" "${{ env.GCS_BUCKET }}/latest/channels/${ch}.json"
          done

          gcloud storage cp results/validation.json            ${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/validation.json
          gcloud storage cp results/od_validation.json         ${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/od_validation.json
          gcloud storage cp results/validation_report.html     ${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/validation_report.html
          gcloud storage cp results/validation_report.data.json ${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/validation_report.data.json
          # The predictive-power timelines (Part 4.2) travel as a second sidecar the
          # page fetches beside itself; absent when the run carried no walk aggregate.
          if [ -f results/validation_report.predict.json ]; then
            gcloud storage cp results/validation_report.predict.json "${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/validation_report.predict.json"
          fi
          gcloud storage cp results/validation_summary.json    ${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/validation_summary.json
          for ch in rust python c cli core assist findorb oorb kete jorbit layup orbfit; do
            f="results/validation_${ch}.json"
            [ -f "$f" ] && gcloud storage cp "$f" "${{ env.GCS_BUCKET }}/archive/${TIMESTAMP}/channels/${ch}.json"
          done

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: |
            empyrean-validation/results/validation_report.html
            empyrean-validation/results/validation_report.data.json
            empyrean-validation/results/validation_summary.json
            empyrean-validation/results/*.json
            empyrean-validation/results/*.jsonl
          retention-days: 30

      - name: Step summary
        working-directory: empyrean-validation
        run: |
          echo "## Validation Suite — ${TIER} tier" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 -c "
          import json
          s = json.load(open('results/validation_summary.json'))
          print('| channel | rows | pass @ 1e-10 | max Δpos km | p50 t (ms) | speed |')
          print('|---------|-----:|:-------------|------------:|-----------:|------:|')
          for ch in s['channels']:
              passing = ch['n_passing']; total = ch['n_total_compared']
              pass_str = '—' if total == 0 else f\"{passing}/{total}\"
              dpos = ch.get('max_pos_diff_km', 0.0)
              p50 = ch.get('p50_time_ms') or 0
              ratio = ch.get('p50_speed_ratio') or 1.0
              print(f\"| {ch['channel']} | {ch['n_rows']} | {pass_str} | {dpos:.2e} | {p50:.1f} | {ratio:.2f}x |\")
          " >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Only claim a GCS publish when one actually happened — otherwise
          # point at the CI artifact so nobody trusts a stale dashboard.
          #
          # Reads the SAME gate output the upload steps are conditioned on,
          # rather than re-deriving the decision from github.event_name. Two
          # copies of the rule is how a summary comes to announce a publish
          # that never ran: the gate now also refuses non-main refs and subset
          # runs, and an independent copy here would not know that.
          if [ "${{ steps.publish-gate.outputs.publish }}" = "true" ]; then
            echo "Report published to \`${{ env.GCS_BUCKET }}/latest/validation_report.html\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "Report NOT published to GCS (event \`${{ github.event_name }}\`, ref \`${{ github.ref }}\`, OBJECTS \`${OBJECTS:-<full catalog>}\`) — see the \`validation-report\` CI artifact on this run." >> $GITHUB_STEP_SUMMARY
          fi
