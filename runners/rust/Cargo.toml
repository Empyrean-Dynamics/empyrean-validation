[workspace]

[package]
name = "empyrean-validation-rust"
version = "0.1.0"
edition = "2024"
authors = ["Joachim Moeyens <joachim@empyrean-dynamics.com>", "Empyrean Dynamics"]
publish = false

[[bin]]
name = "validate"
path = "src/main.rs"

[features]
# OFF by default: the default build is the Gaussian arm set against the
# PUBLISHED empyrean `=0.10.0` wrapper. Turning it on compiles the
# covariance-realism fit-provenance surface (the engine's NoiseModel,
# delivered-noise-law, delivered-rejection, CovarianceInformation and the
# expected-d2 / tail / n_eff / robust-weight summary), which only the
# unreleased noise-model distribution of empyrean carries. Build with
# `--features noise-model` against that distribution once the chain is
# tagged; never commit a path/patch override to point at it.
noise-model = []

[dependencies]
# Public API via the safe wrapper — same C ABI other channels ride.
# Pinned to the PUBLISHED release this harness version validates, so a
# checkout of a validation tag reproduces the validation-of-record for
# that release. Dev-tree validation is an uncommitted local override —
# see "Local development overrides" in the README.
empyrean = "=0.10.0"
# Shared validation framework: schema (`ValidationResult`,
# `ValidationPlan`), test object catalog, position-error / angular-
# separation metric helpers, and the HTML report renderer. Owned
# by the empyrean-validation repo; consumed here so this rust
# runner emits the same row shape every other channel does.
empyrean-validation = { path = "../.." }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
