[workspace]

[package]
name = "empyrean-validation-cli"
version = "0.1.0"
edition = "2024"
authors = ["Joachim Moeyens <joachim@empyrean-dynamics.com>", "Empyrean Dynamics"]
publish = false

[[bin]]
name = "empyrean-cli-runner"
path = "src/main.rs"

[dependencies]
# CLI distribution channel — exercises the empyrean wrapper just like a
# user invoking `empyrean propagate` from a shell would.
# Pinned to the PUBLISHED release this harness version validates (see
# the rust runner's manifest note).
empyrean = "=0.10.0-rc.0"
clap = { version = "4", features = ["derive"] }
