[workspace]

[package]
name = "empyrean-validation-cli"
version = "0.1.0"
edition = "2024"
authors = ["Joachim Moeyens <joachim@empyrean-dynamics.com>", "Empyrean Dynamics"]
publish = false

[[bin]]
name = "empyrean-cli-runner"
path = "src/main.rs"

[dependencies]
# CLI distribution channel — exercises the empyrean wrapper just like a
# user invoking `empyrean propagate` from a shell would.
# Pinned to the PUBLISHED release this harness version validates (see
# the rust runner's manifest note).
empyrean = "=0.11.0"
clap = { version = "4", features = ["derive"] }
# The validation schema crate supplies the canonical method tags
# (`uncertainty_modes`) plus the suite-wide Monte-Carlo sample count and
# seed, so the cli channel requests the same methods the rust and core
# channels do — one spelling of each fact, never a local copy that can drift.
empyrean-validation = { path = "../.." }

